name: macOS olcum

# BILGI AMACLI OLCUM, KAPI DEGIL.
#
# macOS desteklenen bir hedef DEGIL: ne spec'i, ne .icns ikonu, ne release
# isi var. Buna ragmen README macOS kurulum adimlari veriyor. Bu akis
# "calisiyor mu" sorusunu GERCEK Apple Silicon uzerinde cevapliyor.
#
# Ayri bir dosyada ve elle tetiklenir: ci.yml'in dort isi (test 3.10,
# test 3.12, test-windows, derle) her push'ta kosuyor ve YESIL kalmasi
# gerekiyor. Bilinen kusurlari OLCEN bir is onlarin yanina kirmizi
# olarak oturmamali.
#
# Neden CI: elde Mac yok. GitHub'in macos-14/15 kosucusu arm64 Apple
# Silicon ve genel depolarda bedava, yani gercek donanimda olcum alinabilir.
#
# TeX KURULMUYOR (MacTeX ~5 GB). Gerek de yok: derle.sh macOS'un
# /bin/bash'inde LaTeX'e sira gelmeden, ilk `declare -A` satirinda
# duruyor. TeX'e bagli testler kendiliginden skip olur.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  olcum:
    runs-on: macos-15          # arm64 Apple Silicon (macos-13 Intel'dir)
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Tanitim sayfasi kapisi git tarihini okuyor (bkz.
          # tests/test_install_lists.py).
          fetch-depth: 0

      - name: Ortam
        run: |
          sw_vers
          echo "mimari      : $(uname -m)"
          echo "/bin/bash   : $(/bin/bash --version | head -1)"
          echo "PATH'teki sh: $(command -v bash)"
          echo "pdflatex    : $(command -v pdflatex || echo YOK)"
          echo "texbin      : $(ls -d /Library/TeX/texbin 2>/dev/null || echo YOK)"

      # Docker'daki bash:3.2 imaji Alpine tabanli (musl + BusyBox), yani
      # dil ozelliklerini olcuyor ama Darwin'in userland'ini OLCMUYOR.
      # `stat` maddesi yalniz BSD belgesine dayanan TAHMINDI; burada
      # olculuyor.
      - name: Kabuk dili ve BSD araclari
        run: |
          printf '%s\n' \
            'EXT=TEX' \
            'harf=c' \
            'if declare -A m 2>/dev/null; then echo "declare -A : CALISIYOR"; else echo "declare -A : DUSTU"; fi' \
            'if ( eval "v=\${EXT,,}" ) 2>/dev/null; then echo "kucultme   : CALISIYOR"; else echo "kucultme   : DUSTU"; fi' \
            'if ( eval "v=\${harf^^}" ) 2>/dev/null; then echo "buyutme    : CALISIYOR"; else echo "buyutme    : DUSTU"; fi' \
            > "$RUNNER_TEMP/probe.sh"
          /bin/bash "$RUNNER_TEMP/probe.sh" || true
          echo "stat -c %Y : $(stat -c %Y core/derle.sh 2>&1 | head -1)"
          echo "stat -f %m : $(stat -f %m core/derle.sh 2>&1 | head -1)"

      - name: derle.sh macOS'un /bin/bash'i ile kosuyor mu
        run: |
          printf '%s\n' \
            '\documentclass{article}' \
            '\begin{document}' \
            'deneme' \
            '\end{document}' > "$RUNNER_TEMP/deneme.tex"
          kod=0
          /bin/bash core/derle.sh "$RUNNER_TEMP/deneme.tex" \
            > "$RUNNER_TEMP/cikti.txt" 2>&1 || kod=$?
          echo "cikis kodu: $kod"
          echo "--- ciktinin ilk 20 satiri ---"
          head -20 "$RUNNER_TEMP/cikti.txt" || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # release.yml'deki paketleme isleriyle AYNI surum
          python-version: '3.12'

      # arm64 tekerlekleri GERCEKTEN var mi. `pip install` basarili gorunup
      # Qt yuklenemeyebilir (Windows isinde birebir yasandi), o yuzden
      # import onden patlatiliyor.
      - name: Bagimliliklar arm64'te kuruluyor mu
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt pytest
          python -c "import platform; print('python mimarisi:', platform.machine())"
          python -c "import PyQt6.QtWidgets, PyQt6.Qsci, pypdfium2, PIL, send2trash, dulwich, spylls; print('import: ok')"

      - name: Testler (bilgi amacli)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          kod=0
          python -m pytest tests/ -q --no-header -rs > "$RUNNER_TEMP/pytest.txt" 2>&1 || kod=$?
          echo "pytest cikis kodu: $kod"
          tail -40 "$RUNNER_TEMP/pytest.txt"
          echo "--- dusen testler ---"
          grep '^FAILED' "$RUNNER_TEMP/pytest.txt" | head -40 || echo "(FAILED satiri yok)"

  # ----------------------------------------------------------------
  # Developer ID OLMADAN dagitim: Gatekeeper ne diyor.
  #
  # Notarization Developer ID istiyor (yilda 99 dolar). Onsuz uretilen
  # .app'in indirildikten sonra acilip acilmadigi TAHMIN edilmesin diye
  # `spctl` ile olculuyor: Gatekeeper'in kendi degerlendirme araci.
  #
  # Indirme taklit ediliyor: tarayicinin koydugu `com.apple.quarantine`
  # niteligi elle yaziliyor. Karantinasiz hal, karantinali hal ve
  # `xattr -dr` ile temizlenmis hal ayri ayri olculuyor.
  #
  # SINIR: kullanicinin GORDUGU pencere metni bassiz kosucuda
  # yakalanamiyor. `spctl` hukmu Gatekeeper POLITIKASINI veriyor,
  # Finder'in cikardigi diyalogu vermiyor.
  # ----------------------------------------------------------------
  imza:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gatekeeper durumu
        run: |
          sw_vers | head -2
          echo "mimari      : $(uname -m)"
          echo "spctl durumu: $(spctl --status 2>&1)"

      # Projenin GERCEK paketleyicisi PyInstaller. Onemsiz bir betikle
      # .app uretiliyor: Gatekeeper politikasi paketin ICINE bakmiyor,
      # imzaya ve karantinaya bakiyor, o yuzden asgari paket yeterli ve
      # derle.sh uyumunu beklemeye gerek yok.
      - name: Asgari .app uret (PyInstaller, imzasiz)
        run: |
          python -m pip install --quiet pyinstaller
          printf '%s\n' 'print("selam")' > "$RUNNER_TEMP/mini.py"
          pyinstaller --windowed --name Mini --distpath "$RUNNER_TEMP/dist" \
            --workpath "$RUNNER_TEMP/build" \
            --specpath "$RUNNER_TEMP" "$RUNNER_TEMP/mini.py" > /dev/null
          ls -d "$RUNNER_TEMP/dist/Mini.app"

      - name: Imza ne durumda
        run: |
          codesign -dv --verbose=4 "$RUNNER_TEMP/dist/Mini.app" 2>&1 \
            | grep -Ei 'Identifier|Signature|Authority|TeamIdentifier|flags' || true

      - name: Gatekeeper hukmu (uc hal)
        run: |
          APP="$RUNNER_TEMP/dist/Mini.app"
          hukum() {
            printf '%-26s ' "$1"
            if spctl --assess --type execute "$APP" 2>"$RUNNER_TEMP/e.txt"; then
              echo "KABUL"
            else
              echo "RED: $(tr -d '\n' < "$RUNNER_TEMP/e.txt" | sed "s|$APP||g")"
            fi
          }
          hukum "1) karantinasiz"
          xattr -w com.apple.quarantine \
            "0083;$(printf '%x' "$(date +%s)");Safari;$(uuidgen)" "$APP"
          echo "   nitelik: $(xattr "$APP" | tr '\n' ' ')"
          hukum "2) karantinali (indirilmis)"
          xattr -dr com.apple.quarantine "$APP"
          echo "   nitelik: $(xattr "$APP" | tr '\n' ' ' || echo yok)"
          hukum "3) xattr -dr sonrasi"

      # Kullanicinin Terminal'den `python3 main.py` ile kosturmasi
      # Gatekeeper'a HIC ugramiyor. Karsi kol: karantinali paketin ic
      # ikilisi dogrudan exec edilince ne oluyor.
      - name: Dogrudan exec (karsi kol)
        run: |
          APP="$RUNNER_TEMP/dist/Mini.app"
          xattr -w com.apple.quarantine \
            "0083;$(printf '%x' "$(date +%s)");Safari;$(uuidgen)" "$APP"
          kod=0
          out=$("$APP/Contents/MacOS/Mini" 2>&1) || kod=$?
          echo "karantinali ic ikili: cikis $kod | cikti: $out"
          xattr -dr com.apple.quarantine "$APP"
          kod=0
          out=$("$APP/Contents/MacOS/Mini" 2>&1) || kod=$?
          echo "karantinasiz ic ikili: cikis $kod | cikti: $out"

      # `spctl --assess` UC HALDE DE "rejected" dedi, yani ayirt etmiyor:
      # ad-hoc imza Gatekeeper POLITIKASINDA her zaman reddedilir, oysa
      # yerelde uretilen paket aciliyor. Sebep, denetimin karantinaya
      # bagli olmasi; spctl "acilir mi" sorusunun olcutu DEGIL.
      #
      # `syspolicy_check` macOS 14'ten beri geliyor ve tam bu soruyu
      # cevapliyor: paket dagitima hazir mi, nesi eksik.
      - name: syspolicy_check (Apple'in dagitim denetimi)
        run: |
          APP="$RUNNER_TEMP/dist/Mini.app"
          echo "arac: $(command -v syspolicy_check || echo YOK)"
          command -v syspolicy_check >/dev/null || exit 0
          echo "--- karantinasiz ---"
          syspolicy_check distribution "$APP" 2>&1 | head -20 || true
          xattr -w com.apple.quarantine \
            "0083;$(printf '%x' "$(date +%s)");Safari;$(uuidgen)" "$APP"
          echo "--- karantinali ---"
          syspolicy_check distribution "$APP" 2>&1 | head -20 || true
          echo "--- notarization durumu ---"
          syspolicy_check notary-submission "$APP" 2>&1 | head -10 || true
          xattr -dr com.apple.quarantine "$APP"

      # Betik 153. satirda oldugu icin Darwin'de geri kalan 827 satir HIC
      # kosmadi. Kabuk uyumundan sonra ne cikacagini gormek icin GNU'ya
      # ozgu oldugu bilinen kalan cagrilar tek tek olculuyor.
      #
      # En kritigi `grep "a\|b"`: `\|` bir GNU uzantisi. BSD'de duz metin
      # olarak eslesirse "Rerun to get" hic yakalanmaz, ikinci gecis
      # KOSMAZ ve \ref'ler belgede ?? olarak kalir. Hata da vermez.
      - name: Kalan GNU bagliliklari (BSD userland)
        run: |
          echo "realpath  : $(command -v realpath || echo YOK)"
          [ -n "$(command -v realpath)" ] && \
            echo "            $(realpath core/derle.sh)"
          printf 'Rerun to get cross-references right\n' > "$RUNNER_TEMP/a.txt"
          printf 'Label(s) may have changed\n'           > "$RUNNER_TEMP/b.txt"
          D='Rerun to get\|Label(s) may have changed'
          for f in a b; do
            if grep -q "$D" "$RUNNER_TEMP/$f.txt"; then
              echo "grep \| ($f): ESLESTI"
            else
              echo "grep \| ($f): ESLESMEDI  <<< ikinci gecis kosmaz"
            fi
          done
          echo "--- sed 255 (babel dili) ---"
          echo "! Package babel Error: Unknown option 'turkish'." \
            | sed -n "s/.*Unknown option '\([^']*\)'.*/\1/p"
          echo "--- sed 850 (uyari sayaci) ---"
          printf '   1 ilk uyari\n   3 ikinci uyari\n' \
            | sed -E 's/^ *1 (.*)$/\1/; s/^ *([0-9]+) (.*)$/\2 (x\1)/'
          echo "--- mktemp -d / find -mindepth ---"
          d=$(mktemp -d) && echo "mktemp -d : $d"
          mkdir -p "$d/alt/derin"
          echo "find      : $(cd "$d" && find . -mindepth 1 -type d | tr '\n' ' ')"
          rm -rf "$d"

  # ----------------------------------------------------------------
  # GERCEK TeX ile derleme. Kabuk uyumu yapildiktan SONRA anlamli:
  # oncesinde betik 153. satirda oluyordu ve TeX'in varligi hicbir sey
  # soylemiyordu.
  #
  # BasicTeX (~100 MB) seciliyor, MacTeX (~5 GB) degil: soru "bu belge
  # derleniyor mu" degil, "derle.sh macOS'ta ISLIYOR mu". Eksik paket
  # cikarsa o TeX Live'in kapsami, betigin kusuru degil; ayirt edilebilsin
  # diye once araclarin varligi yazdiriliyor.
  # ----------------------------------------------------------------
  tex:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: BasicTeX kur
        run: |
          brew install --cask basictex
          eval "$(/usr/libexec/path_helper)"
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"

      - name: Hangi araclar var
        run: |
          for a in pdflatex xelatex lualatex biber bibtex makeindex synctex; do
            printf '%-12s %s\n' "$a" "$(command -v $a || echo YOK)"
          done
          echo "tlmgr: $(tlmgr --version 2>&1 | head -1)"

      # Test paketi TAM TeX Live ve Linux font yigini varsayiyor; BasicTeX
      # minimal. Eksikleri kurmak, kalan dusen testlerin derle.sh kusuru mu
      # yoksa ORTAM kapsami mi oldugunu AYIRT ETMEK icin. `DejaVu Serif`
      # macOS'ta hic yok, brew ile geliyor.
      - name: Testlerin bekledigi TeX paketleri ve fontlar
        run: |
          sudo tlmgr update --self || true
          sudo tlmgr install glossaries mfirstuc xfor datatool substr \
            tracklang nomencl imakeidx psnfss cm-super || true
          brew install --cask font-dejavu || true
          echo "kurulu fontlar (DejaVu):"
          ls ~/Library/Fonts /Library/Fonts 2>/dev/null | grep -i dejavu | head -3 \
            || echo "  YOK"

      - name: derle.sh ile GERCEK derleme
        run: |
          mkdir -p "$RUNNER_TEMP/p"
          printf '%s\n' \
            '\documentclass{article}' \
            '\begin{document}' \
            '\section{Birinci}\label{b}' \
            'Bkz. bolum \ref{b}.' \
            '\end{document}' > "$RUNNER_TEMP/p/tez.tex"
          kod=0
          /bin/bash core/derle.sh --pdflatex "$RUNNER_TEMP/p/tez.tex" \
            > "$RUNNER_TEMP/derle.txt" 2>&1 || kod=$?
          echo "cikis kodu: $kod"
          cat "$RUNNER_TEMP/derle.txt"
          echo "--- PDF ---"
          ls -la "$RUNNER_TEMP/p/tez.pdf" 2>&1 || echo "PDF YOK"

      # Ikinci gecis KOSTU mu: \ref cozulmezse PDF'te "??" kalir. Kehanet
      # PDF'in METNI, "PDF var mi" degil.
      - name: Ikinci gecis calisti mi (PDF metni)
        run: |
          python -m pip install --quiet pypdfium2
          python - "$RUNNER_TEMP/p/tez.pdf" <<'PY'
          import sys
          import pypdfium2 as pdfium
          d = pdfium.PdfDocument(sys.argv[1])
          t = "\n".join(d[i].get_textpage().get_text_bounded()
                        for i in range(len(d)))
          d.close()
          print("PDF metni: %r" % t.strip()[:120])
          print("cozulmemis atif (??) var mi:", "??" in t)
          print("bolum numarasi yerinde mi:", "bolum 1" in t.replace("\u00a0", " "))
          PY

      # Eksik glif kapisi macOS'ta 160 yerine 480 sayiyor (tam 3 kat).
      # Iki aday: motor uc kez kosuyor, ya da harf UC AYRI yazi tipinde
      # birden eksik. Ayirt edici, toplanan satirlarin kendisi: dedup
      # anahtari (harf, yazi tipi) oldugu icin font adlari gorunur.
      - name: Eksik glif neden 3 kat (tani)
        run: |
          mkdir -p "$RUNNER_TEMP/g"
          python - > "$RUNNER_TEMP/g/ana.tex" <<'PY'
          govde = "Turkce harfler: \u0131\u015f\u011f\u0130. " * 40
          print("\\documentclass{article}\n\\usepackage[T1]{fontenc}\n"
                "\\usepackage{mathptmx}\n\\begin{document}\n" + govde
                + "\n\\end{document}")
          PY
          /bin/bash core/derle.sh "$RUNNER_TEMP/g/ana.tex" \
            > "$RUNNER_TEMP/g/cikti.txt" 2>&1 || true
          echo "--- toplanan glif satirlari ---"
          sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/g/cikti.txt" \
            | grep 'Missing character' | head -20
          echo "--- motor kac kez kostu (gunluk banner) ---"
          grep -c '^This is ' "$RUNNER_TEMP/g/ana.log" 2>/dev/null \
            || echo "(gunluk yok, derleme basarili demektir)"

      - name: derle.sh test paketi (macOS)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --quiet -r desktop/requirements.txt pytest
          kod=0
          python -m pytest tests/test_derle_sh.py tests/test_derle_oneri.py \
            tests/test_paket_haritasi.py -q --no-header \
            > "$RUNNER_TEMP/pt.txt" 2>&1 || kod=$?
          echo "cikis kodu: $kod"
          tail -25 "$RUNNER_TEMP/pt.txt"
          grep '^FAILED' "$RUNNER_TEMP/pt.txt" | head -20 || echo "(FAILED yok)"

  # ----------------------------------------------------------------
  # "Eksik paket" tavsiyesi macOS'ta NE OLMALI.
  #
  # Betik ve env_check kosulsuz `sudo apt-get install <debian-adi>` diyor.
  # macOS'ta apt yok; TeX Live paketleri `tlmgr` ile geliyor ve adlari
  # DEBIAN degil CTAN adlari (`texlive-latex-extra` tlmgr'de YOK).
  #
  # Dogru adlar tahmin edilmiyor, TeX Live'in KENDI veritabanina
  # soruluyor. Dosya listesi derle.sh'ten okunuyor, teste kopyalanmiyor.
  # ----------------------------------------------------------------
  tlmgr:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: BasicTeX kur
        run: |
          brew install --cask basictex
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"

      - name: Dosya adlari -> CTAN paketi
        run: |
          python3 - > "$RUNNER_TEMP/adlar.txt" <<'PY'
          import re
          k = open("core/derle.sh", encoding="utf-8").read()
          m = re.search(r'\npaket_ara\(\) \{\n    case "\$1" in\n(.*?)\n    esac',
                        k, re.S)
          for desen, _ in re.findall(
                  r'^        (\S+)\)\n +echo "([^"]+)" ;;', m.group(1), re.M):
              for ad in desen.split("|"):
                  print(ad)
          PY
          echo "sorulacak dosya: $(wc -l < "$RUNNER_TEMP/adlar.txt")"
          # BUTUN eslesmeler yazdiriliyor. `head -1` ile ilkini almak
          # yanlisti: bir dosya birden cok pakette gecebiliyor ve ilk
          # alfabetik eslesme dogru paket olmayabiliyor (IEEEtran.bst hem
          # `confproc` hem `ieeetran` icinde).
          while read -r ad; do
            hepsi=$(tlmgr search --global --file "/$ad" 2>/dev/null \
                    | grep -E '^[a-z0-9.-]+:$' | tr -d ':' | tr '\n' ' ')
            printf '%-22s %s\n' "$ad" "${hepsi:-BULUNAMADI}"
          done < "$RUNNER_TEMP/adlar.txt"

      - name: Babel dilleri -> CTAN paketi
        run: |
          python3 - > "$RUNNER_TEMP/diller.txt" <<'PY'
          import re
          k = open("core/derle.sh", encoding="utf-8").read()
          m = re.search(r'\nbabel_ara\(\) \{\n    case "\$1" in\n(.*?)\n    esac',
                        k, re.S)
          for desen, _ in re.findall(
                  r'^        (\S+)\)\n +echo "([^"]+)" ;;', m.group(1), re.M):
              for ad in desen.split("|"):
                  print(ad)
          PY
          while read -r dil; do
            if tlmgr info "babel-$dil" >/dev/null 2>&1; then
              printf '%-14s babel-%s\n' "$dil" "$dil"
            else
              p=$(tlmgr search --global --file "/$dil.ldf" 2>/dev/null \
                  | grep -E '^[a-z0-9.-]+:$' | head -1 | tr -d ':')
              printf '%-14s %s\n' "$dil" "${p:-BULUNAMADI}"
            fi
          done < "$RUNNER_TEMP/diller.txt"

      - name: Arac paketleri
        run: |
          for a in biber latexmk pygmentize; do
            p=$(tlmgr search --global --file "/$a" 2>/dev/null \
                | grep -E '^[a-z0-9.-]+:$' | head -1 | tr -d ':')
            printf '%-12s %s\n' "$a" "${p:-BULUNAMADI}"
          done
          echo "pandoc (brew): $(brew info --formula pandoc 2>/dev/null | head -1)"
