name: macOS olcum

# BILGI AMACLI OLCUM, KAPI DEGIL.
#
# macOS desteklenen bir hedef DEGIL: ne spec'i, ne .icns ikonu, ne release
# isi var. Buna ragmen README macOS kurulum adimlari veriyor. Bu akis
# "calisiyor mu" sorusunu GERCEK Apple Silicon uzerinde cevapliyor.
#
# Ayri bir dosyada ve elle tetiklenir: ci.yml'in dort isi (test 3.10,
# test 3.12, test-windows, derle) her push'ta kosuyor ve YESIL kalmasi
# gerekiyor. Bilinen kusurlari OLCEN bir is onlarin yanina kirmizi
# olarak oturmamali.
#
# Neden CI: elde Mac yok. GitHub'in macos-14/15 kosucusu arm64 Apple
# Silicon ve genel depolarda bedava, yani gercek donanimda olcum alinabilir.
#
# TeX KURULMUYOR (MacTeX ~5 GB). Gerek de yok: derle.sh macOS'un
# /bin/bash'inde LaTeX'e sira gelmeden, ilk `declare -A` satirinda
# duruyor. TeX'e bagli testler kendiliginden skip olur.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  olcum:
    runs-on: macos-15          # arm64 Apple Silicon (macos-13 Intel'dir)
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Tanitim sayfasi kapisi git tarihini okuyor (bkz.
          # tests/test_install_lists.py).
          fetch-depth: 0

      - name: Ortam
        run: |
          sw_vers
          echo "mimari      : $(uname -m)"
          echo "/bin/bash   : $(/bin/bash --version | head -1)"
          echo "PATH'teki sh: $(command -v bash)"
          echo "pdflatex    : $(command -v pdflatex || echo YOK)"
          echo "texbin      : $(ls -d /Library/TeX/texbin 2>/dev/null || echo YOK)"

      # Docker'daki bash:3.2 imaji Alpine tabanli (musl + BusyBox), yani
      # dil ozelliklerini olcuyor ama Darwin'in userland'ini OLCMUYOR.
      # `stat` maddesi yalniz BSD belgesine dayanan TAHMINDI; burada
      # olculuyor.
      - name: Kabuk dili ve BSD araclari
        run: |
          printf '%s\n' \
            'EXT=TEX' \
            'harf=c' \
            'if declare -A m 2>/dev/null; then echo "declare -A : CALISIYOR"; else echo "declare -A : DUSTU"; fi' \
            'if ( eval "v=\${EXT,,}" ) 2>/dev/null; then echo "kucultme   : CALISIYOR"; else echo "kucultme   : DUSTU"; fi' \
            'if ( eval "v=\${harf^^}" ) 2>/dev/null; then echo "buyutme    : CALISIYOR"; else echo "buyutme    : DUSTU"; fi' \
            > "$RUNNER_TEMP/probe.sh"
          /bin/bash "$RUNNER_TEMP/probe.sh" || true
          echo "stat -c %Y : $(stat -c %Y core/derle.sh 2>&1 | head -1)"
          echo "stat -f %m : $(stat -f %m core/derle.sh 2>&1 | head -1)"

      - name: derle.sh macOS'un /bin/bash'i ile kosuyor mu
        run: |
          printf '%s\n' \
            '\documentclass{article}' \
            '\begin{document}' \
            'deneme' \
            '\end{document}' > "$RUNNER_TEMP/deneme.tex"
          kod=0
          /bin/bash core/derle.sh "$RUNNER_TEMP/deneme.tex" \
            > "$RUNNER_TEMP/cikti.txt" 2>&1 || kod=$?
          echo "cikis kodu: $kod"
          echo "--- ciktinin ilk 20 satiri ---"
          head -20 "$RUNNER_TEMP/cikti.txt" || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # release.yml'deki paketleme isleriyle AYNI surum
          python-version: '3.12'

      # arm64 tekerlekleri GERCEKTEN var mi. `pip install` basarili gorunup
      # Qt yuklenemeyebilir (Windows isinde birebir yasandi), o yuzden
      # import onden patlatiliyor.
      - name: Bagimliliklar arm64'te kuruluyor mu
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt pytest
          python -c "import platform; print('python mimarisi:', platform.machine())"
          python -c "import PyQt6.QtWidgets, PyQt6.Qsci, pypdfium2, PIL, send2trash, dulwich, spylls; print('import: ok')"

      - name: Testler (bilgi amacli)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          kod=0
          python -m pytest tests/ -q --no-header -rs > "$RUNNER_TEMP/pytest.txt" 2>&1 || kod=$?
          echo "pytest cikis kodu: $kod"
          tail -5 "$RUNNER_TEMP/pytest.txt"
          echo "--- dusen testler ---"
          grep '^FAILED' "$RUNNER_TEMP/pytest.txt" | head -40 || echo "(FAILED satiri yok)"
          # Atlanan testlerin GEREKCE DAGILIMI. `tail` ile bakmak yetmiyordu:
          # ozet 40 satiri asiyor ve sayilarin toplami test sayisini
          # tutmuyordu. Burada hepsi sebebe gore toplaniyor.
          echo "--- atlama gerekceleri (sebebe gore) ---"
          grep '^SKIPPED' "$RUNNER_TEMP/pytest.txt" \
            | sed -E 's/^SKIPPED \[([0-9]+)\] [^ ]+ /\1|/' \
            | awk -F'|' '{a[$2]+=$1; t+=$1} END {for (k in a) printf "%5d  %s\n", a[k], k; printf "%5d  TOPLAM\n", t}' \
            | sort -rn

  # ----------------------------------------------------------------
  # Developer ID OLMADAN dagitim: Gatekeeper ne diyor.
  #
  # Notarization Developer ID istiyor (yilda 99 dolar). Onsuz uretilen
  # .app'in indirildikten sonra acilip acilmadigi TAHMIN edilmesin diye
  # `spctl` ile olculuyor: Gatekeeper'in kendi degerlendirme araci.
  #
  # Indirme taklit ediliyor: tarayicinin koydugu `com.apple.quarantine`
  # niteligi elle yaziliyor. Karantinasiz hal, karantinali hal ve
  # `xattr -dr` ile temizlenmis hal ayri ayri olculuyor.
  #
  # SINIR: kullanicinin GORDUGU pencere metni bassiz kosucuda
  # yakalanamiyor. `spctl` hukmu Gatekeeper POLITIKASINI veriyor,
  # Finder'in cikardigi diyalogu vermiyor.
  # ----------------------------------------------------------------
  imza:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gatekeeper durumu
        run: |
          sw_vers | head -2
          echo "mimari      : $(uname -m)"
          echo "spctl durumu: $(spctl --status 2>&1)"

      # Projenin GERCEK paketleyicisi PyInstaller. Onemsiz bir betikle
      # .app uretiliyor: Gatekeeper politikasi paketin ICINE bakmiyor,
      # imzaya ve karantinaya bakiyor, o yuzden asgari paket yeterli ve
      # derle.sh uyumunu beklemeye gerek yok.
      - name: Asgari .app uret (PyInstaller, imzasiz)
        run: |
          python -m pip install --quiet pyinstaller
          printf '%s\n' 'print("selam")' > "$RUNNER_TEMP/mini.py"
          pyinstaller --windowed --name Mini --distpath "$RUNNER_TEMP/dist" \
            --workpath "$RUNNER_TEMP/build" \
            --specpath "$RUNNER_TEMP" "$RUNNER_TEMP/mini.py" > /dev/null
          ls -d "$RUNNER_TEMP/dist/Mini.app"

      - name: Imza ne durumda
        run: |
          codesign -dv --verbose=4 "$RUNNER_TEMP/dist/Mini.app" 2>&1 \
            | grep -Ei 'Identifier|Signature|Authority|TeamIdentifier|flags' || true

      - name: Gatekeeper hukmu (uc hal)
        run: |
          APP="$RUNNER_TEMP/dist/Mini.app"
          hukum() {
            printf '%-26s ' "$1"
            if spctl --assess --type execute "$APP" 2>"$RUNNER_TEMP/e.txt"; then
              echo "KABUL"
            else
              echo "RED: $(tr -d '\n' < "$RUNNER_TEMP/e.txt" | sed "s|$APP||g")"
            fi
          }
          hukum "1) karantinasiz"
          xattr -w com.apple.quarantine \
            "0083;$(printf '%x' "$(date +%s)");Safari;$(uuidgen)" "$APP"
          echo "   nitelik: $(xattr "$APP" | tr '\n' ' ')"
          hukum "2) karantinali (indirilmis)"
          xattr -dr com.apple.quarantine "$APP"
          echo "   nitelik: $(xattr "$APP" | tr '\n' ' ' || echo yok)"
          hukum "3) xattr -dr sonrasi"

      # Kullanicinin Terminal'den `python3 main.py` ile kosturmasi
      # Gatekeeper'a HIC ugramiyor. Karsi kol: karantinali paketin ic
      # ikilisi dogrudan exec edilince ne oluyor.
      - name: Dogrudan exec (karsi kol)
        run: |
          APP="$RUNNER_TEMP/dist/Mini.app"
          xattr -w com.apple.quarantine \
            "0083;$(printf '%x' "$(date +%s)");Safari;$(uuidgen)" "$APP"
          kod=0
          out=$("$APP/Contents/MacOS/Mini" 2>&1) || kod=$?
          echo "karantinali ic ikili: cikis $kod | cikti: $out"
          xattr -dr com.apple.quarantine "$APP"
          kod=0
          out=$("$APP/Contents/MacOS/Mini" 2>&1) || kod=$?
          echo "karantinasiz ic ikili: cikis $kod | cikti: $out"

      # `spctl --assess` UC HALDE DE "rejected" dedi, yani ayirt etmiyor:
      # ad-hoc imza Gatekeeper POLITIKASINDA her zaman reddedilir, oysa
      # yerelde uretilen paket aciliyor. Sebep, denetimin karantinaya
      # bagli olmasi; spctl "acilir mi" sorusunun olcutu DEGIL.
      #
      # `syspolicy_check` macOS 14'ten beri geliyor ve tam bu soruyu
      # cevapliyor: paket dagitima hazir mi, nesi eksik.
      - name: syspolicy_check (Apple'in dagitim denetimi)
        run: |
          APP="$RUNNER_TEMP/dist/Mini.app"
          echo "arac: $(command -v syspolicy_check || echo YOK)"
          command -v syspolicy_check >/dev/null || exit 0
          echo "--- karantinasiz ---"
          syspolicy_check distribution "$APP" 2>&1 | head -20 || true
          xattr -w com.apple.quarantine \
            "0083;$(printf '%x' "$(date +%s)");Safari;$(uuidgen)" "$APP"
          echo "--- karantinali ---"
          syspolicy_check distribution "$APP" 2>&1 | head -20 || true
          echo "--- notarization durumu ---"
          syspolicy_check notary-submission "$APP" 2>&1 | head -10 || true
          xattr -dr com.apple.quarantine "$APP"

      # Betik 153. satirda oldugu icin Darwin'de geri kalan 827 satir HIC
      # kosmadi. Kabuk uyumundan sonra ne cikacagini gormek icin GNU'ya
      # ozgu oldugu bilinen kalan cagrilar tek tek olculuyor.
      #
      # En kritigi `grep "a\|b"`: `\|` bir GNU uzantisi. BSD'de duz metin
      # olarak eslesirse "Rerun to get" hic yakalanmaz, ikinci gecis
      # KOSMAZ ve \ref'ler belgede ?? olarak kalir. Hata da vermez.
      - name: Kalan GNU bagliliklari (BSD userland)
        run: |
          echo "realpath  : $(command -v realpath || echo YOK)"
          [ -n "$(command -v realpath)" ] && \
            echo "            $(realpath core/derle.sh)"
          printf 'Rerun to get cross-references right\n' > "$RUNNER_TEMP/a.txt"
          printf 'Label(s) may have changed\n'           > "$RUNNER_TEMP/b.txt"
          D='Rerun to get\|Label(s) may have changed'
          for f in a b; do
            if grep -q "$D" "$RUNNER_TEMP/$f.txt"; then
              echo "grep \| ($f): ESLESTI"
            else
              echo "grep \| ($f): ESLESMEDI  <<< ikinci gecis kosmaz"
            fi
          done
          echo "--- sed 255 (babel dili) ---"
          echo "! Package babel Error: Unknown option 'turkish'." \
            | sed -n "s/.*Unknown option '\([^']*\)'.*/\1/p"
          echo "--- sed 850 (uyari sayaci) ---"
          printf '   1 ilk uyari\n   3 ikinci uyari\n' \
            | sed -E 's/^ *1 (.*)$/\1/; s/^ *([0-9]+) (.*)$/\2 (x\1)/'
          echo "--- mktemp -d / find -mindepth ---"
          d=$(mktemp -d) && echo "mktemp -d : $d"
          mkdir -p "$d/alt/derin"
          echo "find      : $(cd "$d" && find . -mindepth 1 -type d | tr '\n' ' ')"
          rm -rf "$d"

  # ----------------------------------------------------------------
  # GERCEK TeX ile derleme. Kabuk uyumu yapildiktan SONRA anlamli:
  # oncesinde betik 153. satirda oluyordu ve TeX'in varligi hicbir sey
  # soylemiyordu.
  #
  # BasicTeX (~100 MB) seciliyor, MacTeX (~5 GB) degil: soru "bu belge
  # derleniyor mu" degil, "derle.sh macOS'ta ISLIYOR mu". Eksik paket
  # cikarsa o TeX Live'in kapsami, betigin kusuru degil; ayirt edilebilsin
  # diye once araclarin varligi yazdiriliyor.
  # ----------------------------------------------------------------
  tex:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: BasicTeX kur
        run: |
          brew install --cask basictex
          eval "$(/usr/libexec/path_helper)"
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"

      - name: Hangi araclar var
        run: |
          for a in pdflatex xelatex lualatex biber bibtex makeindex synctex; do
            printf '%-12s %s\n' "$a" "$(command -v $a || echo YOK)"
          done
          echo "tlmgr: $(tlmgr --version 2>&1 | head -1)"

      # Test paketi TAM TeX Live ve Linux font yigini varsayiyor; BasicTeX
      # minimal. Eksikleri kurmak, kalan dusen testlerin derle.sh kusuru mu
      # yoksa ORTAM kapsami mi oldugunu AYIRT ETMEK icin. `DejaVu Serif`
      # macOS'ta hic yok, brew ile geliyor.
      - name: Testlerin bekledigi TeX paketleri ve fontlar
        run: |
          sudo tlmgr update --self || true
          sudo tlmgr install glossaries mfirstuc xfor datatool substr \
            tracklang nomencl imakeidx psnfss cm-super || true
          # biber/biblatex ve pandoc BasicTeX'te yok; ikisi de tam takimda
          # canli testi olan yollar (kaynakca ve disa aktarma). Kurulmazsa o
          # testler macOS'ta atlanir ve kor nokta kapanmaz.
          sudo tlmgr install biber biblatex || true
          brew install pandoc || true
          # minted (kod renklendirme) ve multibib/natbib (cok kaynakcali
          # belge) BasicTeX'te yok; ikisinin de canli testi var ve macOS'ta
          # atlaniyordu. minted ayrica `pygmentize` istiyor.
          sudo tlmgr install minted multibib natbib fvextra upquote \
            catchfile xstring framed || true
          python -m pip install --quiet Pygments
          brew install --cask font-dejavu || true
          echo "kurulu fontlar (DejaVu):"
          ls ~/Library/Fonts /Library/Fonts 2>/dev/null | grep -i dejavu | head -3 \
            || echo "  YOK"

      - name: derle.sh ile GERCEK derleme
        run: |
          mkdir -p "$RUNNER_TEMP/p"
          printf '%s\n' \
            '\documentclass{article}' \
            '\begin{document}' \
            '\section{Birinci}\label{b}' \
            'Bkz. bolum \ref{b}.' \
            '\end{document}' > "$RUNNER_TEMP/p/tez.tex"
          kod=0
          /bin/bash core/derle.sh --pdflatex "$RUNNER_TEMP/p/tez.tex" \
            > "$RUNNER_TEMP/derle.txt" 2>&1 || kod=$?
          echo "cikis kodu: $kod"
          cat "$RUNNER_TEMP/derle.txt"
          echo "--- PDF ---"
          ls -la "$RUNNER_TEMP/p/tez.pdf" 2>&1 || echo "PDF YOK"

      # Ikinci gecis KOSTU mu: \ref cozulmezse PDF'te "??" kalir. Kehanet
      # PDF'in METNI, "PDF var mi" degil.
      - name: Ikinci gecis calisti mi (PDF metni)
        run: |
          python -m pip install --quiet pypdfium2
          python - "$RUNNER_TEMP/p/tez.pdf" <<'PY'
          import sys
          import pypdfium2 as pdfium
          d = pdfium.PdfDocument(sys.argv[1])
          t = "\n".join(d[i].get_textpage().get_text_bounded()
                        for i in range(len(d)))
          d.close()
          print("PDF metni: %r" % t.strip()[:120])
          print("cozulmemis atif (??) var mi:", "??" in t)
          print("bolum numarasi yerinde mi:", "bolum 1" in t.replace("\u00a0", " "))
          PY

      # Eksik glif kapisi macOS'ta 160 yerine 480 sayiyor (tam 3 kat).
      # Iki aday: motor uc kez kosuyor, ya da harf UC AYRI yazi tipinde
      # birden eksik. Ayirt edici, toplanan satirlarin kendisi: dedup
      # anahtari (harf, yazi tipi) oldugu icin font adlari gorunur.
      - name: Eksik glif neden 3 kat (tani)
        run: |
          mkdir -p "$RUNNER_TEMP/g"
          python - > "$RUNNER_TEMP/g/ana.tex" <<'PY'
          govde = "Turkce harfler: \u0131\u015f\u011f\u0130. " * 40
          print("\\documentclass{article}\n\\usepackage[T1]{fontenc}\n"
                "\\usepackage{mathptmx}\n\\begin{document}\n" + govde
                + "\n\\end{document}")
          PY
          /bin/bash core/derle.sh "$RUNNER_TEMP/g/ana.tex" \
            > "$RUNNER_TEMP/g/cikti.txt" 2>&1 || true
          echo "--- toplanan glif satirlari ---"
          sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/g/cikti.txt" \
            | grep 'Missing character' | head -20
          echo "--- motor kac kez kostu (gunluk banner) ---"
          grep -c '^This is ' "$RUNNER_TEMP/g/ana.log" 2>/dev/null \
            || echo "(gunluk yok, derleme basarili demektir)"

      # FINDER TUZAGI. MacTeX ikililerini `/Library/TeX/texbin`e koyuyor ve
      # o yolu `/etc/paths.d/TeX` ile bildiriyor; orayi `path_helper` okuyor
      # ve path_helper YALNIZ giris kabuklarinda kosuyor. Finder'dan ya da
      # Dock'tan acilan bir `.app` launchd ortamini devraliyor, yani o yolu
      # HIC gormuyor.
      #
      # Olcum uygulamanin KENDI arama mantigiyla (`shutil.which`), Finder'in
      # verdigi asgari PATH altinda. IKI KOL: duzeltme (`macos_path_tamamla`)
      # ONCE ve SONRA. Once dordu de BULUNAMADI olmali, sonra dordu de
      # bulunmali; ikisi ayni cikarsa olcum bir sey ayirt etmiyor demektir.
      - name: Finder'dan acilan .app MacTeX'i buluyor mu
        run: |
          echo "giris kabugunda texbin girdisi: $(echo "$PATH" | tr ':' '\n' | grep -c texbin)"
          echo "pdflatex (giris kabugu)       : $(command -v pdflatex || echo YOK)"
          echo "--- Finder'in asgari PATH'i, DUZELTMESIZ ---"
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" /usr/bin/python3 -c 'import shutil; [print("  %-9s %s" % (a, shutil.which(a) or "BULUNAMADI")) for a in ("pdflatex", "lualatex", "biber", "synctex")]'
          echo "--- ayni PATH, macos_path_tamamla() ile ---"
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$HOME" PYTHONPATH="$PWD" /usr/bin/python3 -c 'import shutil; from core.paths import macos_path_tamamla; macos_path_tamamla(); [print("  %-9s %s" % (a, shutil.which(a) or "BULUNAMADI")) for a in ("pdflatex", "lualatex", "biber", "synctex")]'

      # SYNCTEX NEDEN DUSUYOR. Bes canli test de macOS'ta dustu ve
      # `forward_search` None donuyor. Uc aday: `.synctex.gz` hic
      # uretilmiyor, `synctex` ikilisi bulunamiyor, ya da cikti
      # ayristirilamiyor. Uctan ucune tek tek bakiliyor.
      - name: SyncTeX tanisi
        run: |
          d="$RUNNER_TEMP/sync"
          mkdir -p "$d"
          printf '%s\n' \
            '\documentclass{article}' \
            '\begin{document}' \
            'birinci satir' \
            '' \
            'ikinci satir' \
            '\end{document}' > "$d/s.tex"
          echo "synctex ikilisi : $(command -v synctex || echo YOK)"
          /bin/bash core/derle.sh "$d/s.tex" > "$d/derle.log" 2>&1 || true
          echo "uretilen dosyalar:"
          ls -la "$d" | awk '{print "   ", $5, $9}'
          echo "--- KOL 1: -d YOK (.gz pdf'in yaninda) ---"
          kod=0
          synctex view -i "5:1:$d/s.tex" -o "$d/s.pdf" > "$d/v1.txt" 2>&1 || kod=$?
          echo "cikis kodu: $kod | Page satiri: $(grep -c '^Page:' "$d/v1.txt")"
          head -8 "$d/v1.txt"
          # KOL 2: testin yaptigi gibi .gz AYRI dizine tasinip `-d` veriliyor.
          # Uygulama da boyle cagiriyor (derleme gecici dizinde kosuyor, .gz
          # ayri tutuluyor). Fark buradaysa kusur `-d` yolunda.
          echo "--- KOL 2: .gz ayri dizinde, -d ile ---"
          mkdir -p "$d/gz"
          mv "$d/s.synctex.gz" "$d/gz/s.synctex.gz"
          kod=0
          synctex view -i "5:1:$d/s.tex" -o "$d/s.pdf" -d "$d/gz"             > "$d/v2.txt" 2>&1 || kod=$?
          echo "cikis kodu: $kod | Page satiri: $(grep -c '^Page:' "$d/v2.txt")"
          head -8 "$d/v2.txt"

      - name: SyncTeX symlink suphesi
        run: bash .github/scripts/macos_synctex_tani.sh

      # Bagimliliklar BURADA kuruluyor, test adiminin icinde degil: tani
      # adimlari da PyQt6 istiyor ve testten ONCE kosuyor. (Ilk denemede
      # harf duyarsizligi tanisi "No module named 'PyQt6'" ile dustu ve
      # is orada durdugu icin test takimi hic kosmadi.)
      - name: Python bagimliliklari
        run: |
          # python-docx: uretilen .docx acilabiliyor mu kapisi icin (bkz. ci.yml)
          python -m pip install --quiet -r desktop/requirements.txt pytest python-docx

      # HARF DUYARSIZLIGI. "Klasorde Ara"nin kok denetimi harf vakalarini
      # `os.name != "nt"` ile atliyor ve gerekce "POSIX'te farkli yazim farkli
      # dosyadir" diyor. macOS POSIX ama ONTANIMLI APFS birimi harf DUYARSIZ,
      # yani o varsayim burada gecersiz olabilir. Uc kol yaziliyor: dosya
      # sistemi duyarsiz mi, duzeltme kapaliyken ne oluyor, acikken ne oluyor.
      - name: Dosya sistemi harf duyarsiz mi (tani)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python .github/scripts/macos_harf_duyarsizligi.py

      # TAM TAKIM, TeX KURULUYKEN.
      #
      # Burasi dort dosya kosturuyordu. `olcum` isi tam takimi kosturuyor ama
      # orada TeX YOK: son kosuda TeX'e bagli 153 test atlandi. Burada ise TeX
      # VAR (BasicTeX pdflatex/lualatex/xelatex/bibtex/makeindex/synctex
      # getiriyor) ama takim kosmuyordu. Ikisinin arasindaki bu delikte
      # macOS'a ozgu bir kusur SESSIZCE yasayabiliyor: SyncTeX'in
      # `/private/var` kusuru tam olarak orada durdu ve ancak canli testler
      # buraya eklenince goruldu (bkz. fbb6482). Ayni kor nokta kalan TeX
      # testleri icin de acikti; artik tam takim TeX'li ortamda kosuyor.
      - name: Tam test takimi (TeX kurulu macOS)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          kod=0
          # -rf SART: yalniz -rs ile dusen testin ADI hicbir yerde yazilmiyor,
          # ozet sadece "1 failed" diyor ve gunlukte iz kalmiyor (ilk kosuda
          # boyle oldu). -rf kisa ozete FAILED satirlarini da koyuyor.
          python -m pytest tests/ -q --no-header -rfs \
            > "$RUNNER_TEMP/pt.txt" 2>&1 || kod=$?
          echo "cikis kodu: $kod"
          tail -5 "$RUNNER_TEMP/pt.txt"
          echo "--- dusen testler ---"
          grep '^FAILED' "$RUNNER_TEMP/pt.txt" | head -40 || echo "(FAILED yok)"
          echo "--- dusme ayrintisi ---"
          sed -n '/ FAILURES /,/short test summary/p' "$RUNNER_TEMP/pt.txt" \
            | head -80 || true
          echo "--- atlama gerekceleri (sebebe gore) ---"
          grep '^SKIPPED' "$RUNNER_TEMP/pt.txt" \
            | sed -E 's/^SKIPPED \[([0-9]+)\] [^ ]+ /\1|/' \
            | awk -F'|' '{a[$2]+=$1; t+=$1} END {for (k in a) printf "%5d  %s\n", a[k], k; printf "%5d  TOPLAM\n", t}' \
            | sort -rn

      # ARAYUZUN KENDI derleme yolu macOS'ta PDF uretiyor mu.
      #
      # Derlemeyi arayuzde tetiklemek Ctrl+S ya da Derle dugmesi istiyor.
      # Kosucuda System Events'in Erisilebilirlik izni YOK, o yuzden GUI
      # otomasyonu calismiyor ("Can't get process ... Invalid index").
      # Burada arayuz PROGRAMLA suruluyor: gercek MainWindow, gercek
      # LatexCompiler, gercek derle.sh, gercek TeX.
      #
      # Kapsam disi: PyInstaller paketleme katmani; o ayri olculuyor.
      - name: Arayuzun KENDI derleme yolu (asgari TeX ile)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          kod=0
          python .github/scripts/macos_gui_derleme.py "$RUNNER_TEMP/gui" \
            > "$RUNNER_TEMP/gui.log" 2>&1 || kod=$?
          echo "betik cikis: $kod"
          grep -E "derleme bitti|basarili mi|hata sayisi|PDF var|PDF boyutu|PDF metni|atif cozuldu|^   " \
            "$RUNNER_TEMP/gui.log" || tail -20 "$RUNNER_TEMP/gui.log"

  # ----------------------------------------------------------------
  # "Eksik paket" tavsiyesi macOS'ta NE OLMALI.
  #
  # Betik ve env_check kosulsuz `sudo apt-get install <debian-adi>` diyor.
  # macOS'ta apt yok; TeX Live paketleri `tlmgr` ile geliyor ve adlari
  # DEBIAN degil CTAN adlari (`texlive-latex-extra` tlmgr'de YOK).
  #
  # Dogru adlar tahmin edilmiyor, TeX Live'in KENDI veritabanina
  # soruluyor. Dosya listesi derle.sh'ten okunuyor, teste kopyalanmiyor.
  # ----------------------------------------------------------------
  tlmgr:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: BasicTeX kur
        run: |
          brew install --cask basictex
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"

      - name: Dosya adlari -> CTAN paketi
        run: |
          python3 - > "$RUNNER_TEMP/adlar.txt" <<'PY'
          import re
          k = open("core/derle.sh", encoding="utf-8").read()
          m = re.search(r'\npaket_ara\(\) \{\n    case "\$1" in\n(.*?)\n    esac',
                        k, re.S)
          for desen, _ in re.findall(
                  r'^        (\S+)\)\n +echo "([^"]+)" ;;', m.group(1), re.M):
              for ad in desen.split("|"):
                  print(ad)
          PY
          echo "sorulacak dosya: $(wc -l < "$RUNNER_TEMP/adlar.txt")"
          # BUTUN eslesmeler yazdiriliyor. `head -1` ile ilkini almak
          # yanlisti: bir dosya birden cok pakette gecebiliyor ve ilk
          # alfabetik eslesme dogru paket olmayabiliyor (IEEEtran.bst hem
          # `confproc` hem `ieeetran` icinde).
          while read -r ad; do
            hepsi=$(tlmgr search --global --file "/$ad" 2>/dev/null \
                    | grep -E '^[a-z0-9.-]+:$' | tr -d ':' | tr '\n' ' ')
            printf '%-22s %s\n' "$ad" "${hepsi:-BULUNAMADI}"
          done < "$RUNNER_TEMP/adlar.txt"

      - name: Babel dilleri -> CTAN paketi
        run: |
          python3 - > "$RUNNER_TEMP/diller.txt" <<'PY'
          import re
          k = open("core/derle.sh", encoding="utf-8").read()
          m = re.search(r'\nbabel_ara\(\) \{\n    case "\$1" in\n(.*?)\n    esac',
                        k, re.S)
          for desen, _ in re.findall(
                  r'^        (\S+)\)\n +echo "([^"]+)" ;;', m.group(1), re.M):
              for ad in desen.split("|"):
                  print(ad)
          PY
          while read -r dil; do
            if tlmgr info "babel-$dil" >/dev/null 2>&1; then
              printf '%-14s babel-%s\n' "$dil" "$dil"
            else
              p=$(tlmgr search --global --file "/$dil.ldf" 2>/dev/null \
                  | grep -E '^[a-z0-9.-]+:$' | head -1 | tr -d ':')
              printf '%-14s %s\n' "$dil" "${p:-BULUNAMADI}"
            fi
          done < "$RUNNER_TEMP/diller.txt"

      - name: Arac paketleri
        run: |
          for a in biber latexmk pygmentize; do
            p=$(tlmgr search --global --file "/$a" 2>/dev/null \
                | grep -E '^[a-z0-9.-]+:$' | head -1 | tr -d ':')
            printf '%-12s %s\n' "$a" "${p:-BULUNAMADI}"
          done
          echo "pandoc (brew): $(brew info --formula pandoc 2>/dev/null | head -1)"

  # ----------------------------------------------------------------
  # .app ve .dmg URETILEBILIYOR MU (fizibilite).
  #
  # "macOS'ta paketlenmis yapi yok" demek "uretilemez" demek DEGIL:
  # ortada yazilmamis is var, teknik engel degil. Bu is onu tahmin
  # yerine olcuyor: spec YAZMADAN, PyInstaller'i dogrudan cagirip
  # gercek uygulamadan bir .app ve ondan bir .dmg uretiyor.
  #
  # Kehanet paketin ICINDEN cikan yorumlayicinin uygulamayi gercekten
  # ice aktarabilmesi; "dizin olustu" yeterli degil.
  # ----------------------------------------------------------------
  paketleme:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bagimliliklar
        run: python -m pip install --quiet -r desktop/requirements.txt pyinstaller

      - name: Paket ikonu (.icns)
        run: |
          bash desktop/macos_ikon_uret.sh
          test -f desktop/linux/latex-editor.icns
          file desktop/linux/latex-editor.icns

      - name: Build .app (GERCEK spec)
        working-directory: desktop
        run: |
          python -m PyInstaller --noconfirm latex-editor-macos.spec             > "$RUNNER_TEMP/pyi.log" 2>&1             || { echo "PYINSTALLER DUSTU"; tail -30 "$RUNNER_TEMP/pyi.log"; exit 1; }
          test -d "dist/LaTeX Editor.app"
          du -sh "dist/LaTeX Editor.app" | sed 's/^/.app boyutu: /'

      - name: paket_dogrula .app icini okuyabiliyor mu
        working-directory: desktop
        run: python3 ../scripts/paket_dogrula.py "dist/LaTeX Editor.app"

      - name: Imza gecerli mi
        working-directory: desktop
        run: |
          codesign --verify --deep --strict --verbose=2 "dist/LaTeX Editor.app"
          codesign -dv --verbose=2 "dist/LaTeX Editor.app" 2>&1             | grep -E 'Signature|Identifier' || true

      - name: Info.plist ve ikon
        working-directory: desktop
        run: |
          plist="dist/LaTeX Editor.app/Contents/Info.plist"
          echo "kimlik : $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")"
          echo "surum  : $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          echo "tex ili: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:CFBundleTypeExtensions:0' "$plist")"
          echo "retina : $(/usr/libexec/PlistBuddy -c 'Print :NSHighResolutionCapable' "$plist")"
          ls "dist/LaTeX Editor.app/Contents/Resources/"*.icns

      - name: Build .dmg
        working-directory: desktop
        run: |
          mkdir -p "$RUNNER_TEMP/dmg"
          cp -R "dist/LaTeX Editor.app" "$RUNNER_TEMP/dmg/"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname "LaTeX Editor" -srcfolder "$RUNNER_TEMP/dmg"             -ov -format UDZO "$RUNNER_TEMP/deneme.dmg" > /dev/null
          hdiutil verify "$RUNNER_TEMP/deneme.dmg" > /dev/null && echo ".dmg dogrulandi"
          ls -lh "$RUNNER_TEMP/deneme.dmg" | awk '{print ".dmg boyutu:", $5}'

  # ----------------------------------------------------------------
  # HOMEBREW CASK KARANTINAYI KALDIRMIYOR. Olculdu, sonuc asagida.
  #
  # Yaygin kani "cask ile kurunca Gatekeeper sorunu olmaz". YANLIS;
  # bu depoda da iki kez yanlis hatirlandi, bu is onun kaydi.
  #
  # OLCULDU (2026-09-18, Homebrew 6.0.22, macos-15, gercek bir .dmg
  # gercek bir cask'la kurulup .app'in nitelikleri okunarak):
  #
  #   brew install --cask               nitelik: com.apple.quarantine
  #                                     spctl  : rejected
  #   brew install --cask --no-quarantine
  #                                     invalid option (Homebrew kaldirmis)
  #   brew install --help               quarantine secenegi YOK
  #   HOMEBREW_CASK_OPTS=--no-quarantine
  #                                     cikis 0 ama nitelik yine
  #                                     com.apple.quarantine, spctl rejected
  #
  # Yani cask kullanicisi da `xattr -dr com.apple.quarantine` yazmak
  # zorunda. Cask'in kalan degeri kurulum/yukseltme kolayligi, Gatekeeper
  # sorununu COZMEK degil. Bir kisit daha: Homebrew cask'in gercek bir
  # tap icinde olmasini sart kosuyor, yani cask bu depoda duramaz.
  #
  # KARAR (2026-09-18): cask YAPILMADI. Asil gerekcesi cikmadi, `.dmg`
  # ve yayin notundaki talimat zaten calisiyor. Bu is olcumu tekrar
  # alinabilir tutuyor; Homebrew davranisi degisirse burada gorunur.
  # ----------------------------------------------------------------
  cask:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bagimliliklar
        run: python -m pip install --quiet -r desktop/requirements.txt pyinstaller

      - name: .app ve .dmg uret
        working-directory: desktop
        run: |
          bash macos_ikon_uret.sh
          python -m PyInstaller --noconfirm latex-editor-macos.spec > /dev/null 2>&1
          mkdir -p "$RUNNER_TEMP/dmg"
          cp -R "dist/LaTeX Editor.app" "$RUNNER_TEMP/dmg/"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname "LaTeX Editor" -srcfolder "$RUNNER_TEMP/dmg" \
            -ov -format UDZO "$RUNNER_TEMP/le.dmg" > /dev/null
          ls -lh "$RUNNER_TEMP/le.dmg" | awk '{print ".dmg:", $5}'

      # Homebrew cask'in GERCEK BIR TAP icinde olmasini sart kosuyor:
      # dosyayi dogrudan vermek "Homebrew requires casks to be in a tap"
      # ile reddediliyor. Bu, asil teslimat icin de belirleyici: cask
      # bu depoda duramaz, ayri bir tap deposu gerekiyor.
      - name: Yerel tap kur ve cask'i yerlestir
        run: |
          brew tap-new deneme/yerel --no-git > /dev/null
          tap="$(brew --repository deneme/yerel)"
          mkdir -p "$tap/Casks"
          cat > "$tap/Casks/latex-editor-deneme.rb" <<RB
          cask "latex-editor-deneme" do
            version "9.9.9"
            sha256 :no_check

            url "file://$RUNNER_TEMP/le.dmg"
            name "LaTeX Editor"
            desc "Desktop LaTeX editor with live PDF preview"
            homepage "https://github.com/s-balli/latex-editor"

            depends_on arch: :arm64

            app "LaTeX Editor.app"
          end
          RB
          brew install --cask deneme/yerel/latex-editor-deneme             > "$RUNNER_TEMP/brew.log" 2>&1             || { echo "BREW DUSTU"; tail -25 "$RUNNER_TEMP/brew.log"; exit 1; }
          echo "kuruldu: $(ls -d '/Applications/LaTeX Editor.app')"

      - name: Kurulan .app karantinali mi
        run: |
          APP="/Applications/LaTeX Editor.app"
          echo "nitelikler: $(xattr "$APP" | tr '\n' ' ')"
          if xattr "$APP" | grep -q com.apple.quarantine; then
            echo "SONUC: cask KARANTINA EKLIYOR, kullaniciya yine komut gerekiyor"
          else
            echo "SONUC: cask karantina EKLEMIYOR, komut gerekmiyor"
          fi
          printf 'spctl: '
          spctl --assess --type execute "$APP" 2>&1 || true

      # KARSI KOL: `--no-quarantine` farki gercekten yapiyor mu. Ikisi
      # ayni cikarsa olcum bir sey ayirt etmiyor demektir. Cikti
      # BASTIRILMIYOR: onceki kosuda gizlenmisti ve adim neden dustugu
      # gorunmuyordu.
      # KARSI KOL: karantinayi kaldirmanin Homebrew ICINDE bir yolu var mi.
      # `--no-quarantine` OLCULDU ve YOK: "invalid option". Homebrew onu
      # kaldirmis. Burada hangi mekanizmanin kaldigi araniyor; hicbiri
      # yoksa cask `.dmg` indirmeye gore ek bir kolaylik SAGLAMIYOR ve
      # kullanici yine `xattr` yazmak zorunda.
      - name: Karantinayi kaldirmanin Homebrew ici yolu var mi
        run: |
          echo "brew surumu: $(brew --version | head -1)"
          printf 'install --cask secenekleri icinde quarantine: '
          brew install --help 2>&1 | grep -i quarantine || echo "YOK"
          printf 'HOMEBREW_CASK_OPTS belgede: '
          brew --env 2>&1 | grep -i cask_opts || echo "(env ciktisinda yok)"
          echo "--- HOMEBREW_CASK_OPTS ile deneme ---"
          brew uninstall --cask deneme/yerel/latex-editor-deneme 2>&1 | tail -1
          kod=0
          HOMEBREW_CASK_OPTS="--no-quarantine"             brew install --cask deneme/yerel/latex-editor-deneme             > "$RUNNER_TEMP/nq.log" 2>&1 || kod=$?
          echo "brew cikis: $kod"
          tail -3 "$RUNNER_TEMP/nq.log"
          APP="/Applications/LaTeX Editor.app"
          if [ -d "$APP" ]; then
            echo "nitelikler: $(xattr "$APP" 2>/dev/null | paste -sd' ' -)"
            printf 'spctl: '
            spctl --assess --type execute "$APP" 2>&1 || true
          else
            echo "uygulama kurulmadi"
          fi

  # ----------------------------------------------------------------
  # YAYINLANAN .dmg'yi KULLANICININ YAPTIGI GIBI dene.
  #
  # Simdiye kadarki olcumler paketi URETIP inceledi; bu is yayindan
  # INDIRIP kuruyor ve uygulamayi GERCEKTEN ACIYOR. Boylece yayin
  # notundaki yonergenin tamami sinaniyor: indir, karantinayi kaldir,
  # calistir.
  #
  # Indirme karantinasi ELLE takiliyor: `gh release download` tarayici
  # olmadigi icin isareti koymuyor, oysa gercek kullanicida koyuluyor
  # ve yonergenin varlik sebebi tam olarak o.
  # ----------------------------------------------------------------
  yayinlanan-dmg:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Yayindan .dmg indir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          surum="$(grep VERSION core/version.py | cut -d'"' -f2)"
          echo "surum: $surum"
          gh release download "v$surum" --repo "${{ github.repository }}" \
            --pattern '*_macOS_arm64.dmg' --dir "$RUNNER_TEMP"
          ls -lh "$RUNNER_TEMP"/*.dmg | awk '{print "indirilen:", $5, $9}'

      - name: BasicTeX kur (uygulamanin TeX'i bulmasi icin)
        run: |
          brew install --cask basictex
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"

      # BasicTeX `/etc/paths.d`ye kaydoluyor mu. `macos_path_tamamla()`
      # tam olarak orayi okuyor; kaydolmuyorsa duzeltme BasicTeX'i
      # bulamaz ve "PATH tamamlandi" satirinda texbin gorunmez.
      - name: TeX kendini /etc/paths.d'ye yaziyor mu
        run: |
          echo "/etc/paths.d icerigi:"
          for f in /etc/paths.d/*; do
            [ -f "$f" ] && echo "   $(basename "$f"): $(cat "$f" | paste -sd' ' -)"
          done
          echo "texbin dizin mi : $([ -d /Library/TeX/texbin ] && echo EVET || echo HAYIR)"
          echo "texbin gercek   : $(readlink /Library/TeX/texbin 2>/dev/null || echo '(baglanti degil)')"

      - name: .dmg'yi bagla ve Applications'a kur
        run: |
          dmg="$(ls "$RUNNER_TEMP"/*.dmg | head -1)"
          # Sutunlar SEKME ile ayrili ve baglama noktasi BOSLUK iceriyor
          # ("/Volumes/LaTeX Editor"). Bosluga gore bolmek yalniz "Editor"
          # veriyordu; olcum kabinin kendi kusuruydu.
          nokta="$(hdiutil attach "$dmg" -nobrowse -readonly | tail -1 | awk -F'\t' '{print $NF}')"
          echo "baglandi: $nokta"
          ls "$nokta"
          cp -R "$nokta/LaTeX Editor.app" /Applications/
          hdiutil detach "$nokta" > /dev/null
          echo "kuruldu: $(du -sh '/Applications/LaTeX Editor.app' | cut -f1)"

      # Tarayicidan inen dosyada bu isaret VAR. Yonergenin sinandigi yer.
      - name: Karantina isaretini tak ve yonergeyi uygula
        run: |
          APP="/Applications/LaTeX Editor.app"
          xattr -w com.apple.quarantine \
            "0083;$(printf '%x' "$(date +%s)");Safari;$(uuidgen)" "$APP"
          echo "yonergeden ONCE: $(xattr "$APP" | paste -sd' ' -)"
          printf 'spctl ONCE: '
          spctl --assess --type execute "$APP" 2>&1 || true
          xattr -dr com.apple.quarantine "$APP"
          echo "yonergeden SONRA: $(xattr "$APP" | paste -sd' ' - || echo '(nitelik yok)')"

      - name: Uygulamayi GERCEKTEN ac
        run: |
          APP="/Applications/LaTeX Editor.app"
          kod=0
          open -a "$APP" > "$RUNNER_TEMP/open.log" 2>&1 || kod=$?
          echo "open cikis: $kod"
          cat "$RUNNER_TEMP/open.log" || true
          sleep 20
          if pgrep -f "LaTeX Editor" > /dev/null; then
            echo "SONUC: uygulama CALISIYOR (pid $(pgrep -f 'LaTeX Editor' | head -1))"
          else
            echo "SONUC: uygulama calismiyor"
          fi

      - name: Ekran goruntusu
        run: |
          screencapture -x "$RUNNER_TEMP/ekran.png" 2>&1 || echo "screencapture calismadi"
          ls -lh "$RUNNER_TEMP/ekran.png" 2>/dev/null || echo "goruntu yok"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-ekran-goruntusu
          path: ${{ runner.temp }}/ekran.png
          if-no-files-found: warn

      # PAKETLENMIS UYGULAMANIN KENDISIYLE derleme.
      #
      # Ayrica `macos_path_tamamla()` duzeltmesinin UCTAN UCA sinandigi
      # tek yer: `open` uygulamayi launchd uzerinden baslatiyor, yani
      # PATH Finder'daki gibi asgari geliyor ve MacTeX ancak duzeltme
      # calisiyorsa bulunuyor.
      #
      # IKI KOL: uygulama KAPALIYKEN dosyayla acmak (soguk baslangic) ve
      # ZATEN ACIKKEN dosya gondermek. macOS ikisinde de dosyayi Apple
      # Event ile veriyor; `sys.argv` YOLU MACOS'TA KULLANILMIYOR.
      # Ayrim onemli, cunku Info.plist'teki `.tex` iliskilendirmesi
      # tam olarak bu yola dayaniyor.
      #
      # Kehanet iki katli: pencere basliginda dosya adi VE PDF'in olusmasi.
      - name: Uygulamanin KENDISIYLE derle
        run: |
          is="$RUNNER_TEMP/proje"
          mkdir -p "$is"
          printf '%s\n' \
            '\documentclass{article}' \
            '\begin{document}' \
            '\section{Deneme}\label{b}' \
            'Bkz. bolum \ref{b}.' \
            '\end{document}' > "$is/deneme.tex"
          rm -f "$is/deneme.pdf"

          baslik() {
            osascript -e 'tell application "System Events" to get name of front window of (first process whose name is "LaTeX Editor")' 2>&1 | head -1
          }

          # OLCULEMEDI ile HAYIR AYRI SEYLER. Kosucuda System Events'in
          # Erisilebilirlik izni yok ve `baslik` "execution error ...
          # Invalid index (-1719)" donuyor. Onceki bicim bunu dogrudan
          # HAYIR yaziyordu, yani "olcemedim"i "olmadi" diye bildiriyordu:
          # ayni kosuda uygulama ACILMIS ve PDF URETMISTI (2026-09-18,
          # v1.0.29 dmg'si). Kapida arananin tersi bir kusur sinifi.
          yargi() {
            local b="$1"
            case "$b" in
              *"execution error"*|"") echo "OLCULEMEDI (Erisilebilirlik izni yok)";;
              *deneme*) echo "EVET";;
              *) echo "HAYIR";;
            esac
          }

          echo "--- KOL 1: uygulama KAPALIYKEN dosyayla ac ---"
          osascript -e 'quit app "LaTeX Editor"' 2>&1 | head -1 || true
          sleep 5
          pkill -f "LaTeX Editor" 2>/dev/null || true
          sleep 3
          open -a "/Applications/LaTeX Editor.app" "$is/deneme.tex"
          sleep 25
          b1="$(baslik)"
          echo "pencere basligi: $b1"
          echo "dosya acildi mi: $(yargi "$b1")"

          echo "--- KOL 2: ZATEN ACIKKEN dosya gonder ---"
          open -a "/Applications/LaTeX Editor.app" "$is/deneme.tex"
          sleep 12
          b2="$(baslik)"
          echo "pencere basligi: $b2"
          echo "dosya acildi mi: $(yargi "$b2")"

          echo "--- derlemeyi tetikle (Cmd+S) ---"
          osascript -e 'tell application "System Events" to keystroke "s" using command down' 2>&1 | head -2 || true
          for i in $(seq 1 12); do
            [ -f "$is/deneme.pdf" ] && break
            sleep 10
          done
          if [ -f "$is/deneme.pdf" ]; then
            echo "SONUC: PDF URETILDI ($(du -h "$is/deneme.pdf" | cut -f1))"
            echo "sha256: $(shasum -a 256 "$is/deneme.pdf" | cut -d' ' -f1)"
            python .github/scripts/pdf_ozet.py "$is/deneme.pdf" "macOS" || true
          else
            echo "SONUC: PDF YOK"
            ls -la "$is"
          fi

      # URETILEN PDF'I INDIRILEBILIR YAP. Simdiye kadar yalniz "PDF URETILDI"
      # satiri vardi; dosyanin KENDISI hicbir yere gitmiyordu, yani ne
      # bakilabiliyor ne de baska bir platformun ciktisiyla
      # karsilastirilabiliyordu. Kaynak .tex de yaniyor gidiyor, cunku
      # karsilastirma ancak AYNI kaynakla anlamli.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-uretilen-pdf
          path: |
            ${{ runner.temp }}/proje/deneme.pdf
            ${{ runner.temp }}/proje/deneme.tex
          if-no-files-found: warn

      - name: Derleme sonrasi ekran goruntusu
        if: always()
        run: |
          screencapture -x "$RUNNER_TEMP/ekran-derleme.png" 2>&1 \
            || echo "screencapture calismadi"
          ls -lh "$RUNNER_TEMP/ekran-derleme.png" 2>/dev/null || echo "goruntu yok"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-derleme-goruntusu
          path: ${{ runner.temp }}/ekran-derleme.png
          if-no-files-found: warn

      - name: Uygulama gunlugu ne diyor
        if: always()
        run: |
          gun="$HOME/Library/Application Support/LatexEditor"
          ls -la "$gun" 2>/dev/null || echo "gunluk dizini yok: $gun"
          # HANGI MOTOR kostu: karsilastirma ancak ayni motorla anlamli,
          # o yuzden satir ayrica suzuluyor.
          echo "--- motor satirlari ---"
          find "$HOME/Library" -name "*.log" -path "*atex*" 2>/dev/null | head -3 \
            | while read -r f; do grep -h 'Derleme ba\|Motor' "$f" | tail -5; done \
            || echo "(motor satiri bulunamadi)"
          find "$HOME/Library" -name "*.log" -path "*atex*" 2>/dev/null | head -3 \
            | while read -r f; do echo "--- $f"; tail -20 "$f"; done
