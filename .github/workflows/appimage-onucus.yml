# GECICI. Sinama bitince SILINECEK.
#
# release.yml yalniz `v*` tag'inde kosuyor, yani AppImage yapisindaki bir
# degisiklik ancak tag atildiktan SONRA sinaniyor. v1.0.20'de tam bu oldu:
# tag atildi, Windows exe'si yayina cikti, Linux isi `libxcb-shape.so.0 =>
# not found` ile dustu ve yayin yarim kaldi.
#
# Bu akis release.yml'in build-linux isinin YAPIM VE KAPI adimlarini birebir
# tekrarliyor (yayinlama adimlari yok). Yesil gorunce release.yml'e guvenip
# tag yeniden atilabilir.
name: AppImage on ucus

on:
  workflow_dispatch:
  push:
    branches:
      - 'appimage-onucus'

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gomulecek yorumlayici
        run: python3 --version

      # ONBELLEK YOK: release.yml'deki anahtar v3'e yeni artirildi ve bu
      # akisin onu doldurmasi/bozmasi istenmiyor. Paketler dogrudan iniyor.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv inkscape \
            libxcb-cursor0 libgl1 libegl1 libglib2.0-0 \
            libdbus-1-3 libxkbcommon0 libfontconfig1 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-xkb1 \
            libxcb-image0 libxcb-randr0 libxcb-render0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 \
            libxcb-xfixes0 libx11-xcb1

      - name: Build AppImage
        working-directory: desktop
        run: bash build_appimage.sh

      - name: AppImage bagimliliklari cozuluyor mu
        working-directory: desktop
        run: |
          eklenti=$(find dist/latex-editor/_internal -name libqxcb.so | head -1)
          test -n "$eklenti" || { echo "::error::libqxcb.so bulunamadi"; exit 1; }
          eksik=$(LD_LIBRARY_PATH="$PWD/dist/latex-editor/_internal" \
                  ldd "$eklenti" | grep "not found" || true)
          if [ -n "$eksik" ]; then
            echo "::error::AppImage kendi kendine yetmiyor, eksik kutuphaneler:"
            echo "$eksik"
            exit 1
          fi
          echo "xcb eklentisinin butun bagimliliklari cozuluyor"

      # Kapinin kendisi ldd'ye guveniyor ve ldd sistemdeki kutuphaneyi de
      # cozer. Asil soru "temiz makinede acilir mi", o yuzden AppImage
      # PAKETIN ICINDEN cozuluyor mu diye ayrica bakiliyor: eklentinin her
      # NEEDED girdisi _internal altinda DOSYA olarak var mi.
      - name: Kutuphaneler paketin ICINDE mi
        working-directory: desktop
        run: |
          ic=dist/latex-editor/_internal
          eklenti=$(find "$ic" -name libqxcb.so | head -1)
          eksik=""
          for so in $(objdump -p "$eklenti" | awk '/NEEDED/ {print $2}'); do
            case "$so" in
              libc.so.*|libm.so.*|libgcc_s.so.*|libstdc++.so.*|libdl.so.*|libpthread.so.*)
                continue ;;
            esac
            find "$ic" -name "$so" | grep -q . || eksik="$eksik $so"
          done
          if [ -n "$eksik" ]; then
            echo "::error::pakette olmayan kutuphaneler:$eksik"
            exit 1
          fi
          echo "butun NEEDED girdileri paketin icinde"

      - name: AppImage boyutu
        working-directory: desktop
        run: ls -lh dist/*.AppImage 2>/dev/null || ls -lh dist/
