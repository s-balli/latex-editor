name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    # Tag'lenen kod testleri geçmeden artifact üretilmesin. ci.yml yalnız
    # main push'unda/PR'da koşar; tag push'u orayı tetiklemez, release.yml
    # kendi testini koymadıkça testleri hiç geçmemiş bir komitten de release
    # çıkabilir. Kasıtlı olarak yalnız tek Python sürümü ve pandoc'suz:
    # matris + güncel pandoc zaten main CI'ında koşar (tag normalde main'in
    # testten geçmiş ucundan atılır); pandoc entegrasyon testleri pandoc
    # yoksa skip edilir. derle.sh (TeX) testleri de bu kapıda skip olur;
    # onlar main CI'ının derle job'unda koşar.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Tag ↔ VERSION eşleşmesi
        shell: bash
        run: |
          V="$(grep VERSION core/version.py | cut -d'"' -f2)"
          if [ "v${V}" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} core/version.py ile uyusmuyor (orada v${V}). Önce version.py + pyproject + README'yi güncelle, sonra tag at."
            exit 1
          fi
          echo "Tag eşleşiyor: v${V}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (PyQt6 headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libgl1 libegl1 libglib2.0-0 \
            libdbus-1-3 libxkbcommon0 libfontconfig1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Get version
        id: ver
        shell: bash
        run: echo "VERSION=$(grep VERSION core/version.py | cut -d'"' -f2)" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt -r desktop/requirements-build.txt

      - name: Build exe
        working-directory: desktop
        run: python -m PyInstaller "LaTeX Editor.spec" --clean --noconfirm

      - name: Rename for release
        working-directory: desktop
        shell: bash
        run: mv "dist/LaTeX Editor.exe" "dist/LaTeX_Editor_v${{ steps.ver.outputs.VERSION }}_Windows.exe"

      - name: Generate release notes
        shell: bash
        run: |
          # Gövde TEK KAYNAKTA: scripts/release_notes.sh. Eskiden bu adım
          # build-windows ve build-linux'ta ~100 satır olarak KOPYALANMIŞTI;
          # ikisi birebir aynıydı ama aynı kalmalarını hiçbir şey güvence
          # altına almıyordu (kurulum listesi bir kez sürüklenmişti bile).
          #
          # actions/checkout tag push'ta refs/tags/<tag>'i doğrudan commit
          # SHA'sı ile yazar (annotated tag hafifletilir, %(contents) commit
          # mesajını verir); gerçek tag objesini çekip sonra oku.
          git fetch --no-tags --force origin "+refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          git tag -l --format='%(contents)' "${{ github.ref_name }}" \
            | bash scripts/release_notes.sh "${{ steps.ver.outputs.VERSION }}" \
            > release-notes.md

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/LaTeX_Editor_v${{ steps.ver.outputs.VERSION }}_Windows.exe
          name: LaTeX Editor v${{ steps.ver.outputs.VERSION }}
          body_path: release-notes.md
          fail_on_unmatched_files: true

  build-linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: ver
        shell: bash
        run: echo "VERSION=$(grep VERSION core/version.py | cut -d'"' -f2)" >> $GITHUB_OUTPUT

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv inkscape \
            libxcb-cursor0 libgl1 libegl1 libglib2.0-0 \
            libdbus-1-3 libxkbcommon0 libfontconfig1

      - name: Build AppImage
        working-directory: desktop
        run: bash build_appimage.sh

      - name: Generate release notes
        shell: bash
        run: |
          # Gövde TEK KAYNAKTA: scripts/release_notes.sh. Eskiden bu adım
          # build-windows ve build-linux'ta ~100 satır olarak KOPYALANMIŞTI;
          # ikisi birebir aynıydı ama aynı kalmalarını hiçbir şey güvence
          # altına almıyordu (kurulum listesi bir kez sürüklenmişti bile).
          #
          # actions/checkout tag push'ta refs/tags/<tag>'i doğrudan commit
          # SHA'sı ile yazar (annotated tag hafifletilir, %(contents) commit
          # mesajını verir); gerçek tag objesini çekip sonra oku.
          git fetch --no-tags --force origin "+refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          git tag -l --format='%(contents)' "${{ github.ref_name }}" \
            | bash scripts/release_notes.sh "${{ steps.ver.outputs.VERSION }}" \
            > release-notes.md

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/LaTeX_Editor_v${{ steps.ver.outputs.VERSION }}_Linux_x86_64.AppImage
            desktop/dist/LaTeX_Editor_v${{ steps.ver.outputs.VERSION }}_Linux_x86_64.AppImage.zsync
          name: LaTeX Editor v${{ steps.ver.outputs.VERSION }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
