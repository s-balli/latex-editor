name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    # Tag'lenen kod testleri geçmeden artifact üretilmesin. ci.yml yalnız
    # main push'unda/PR'da koşar; tag push'u orayı tetiklemez, release.yml
    # kendi testini koymadıkça testleri hiç geçmemiş bir komitten de release
    # çıkabilir. Kasıtlı olarak yalnız tek Python sürümü ve pandoc'suz:
    # matris + güncel pandoc zaten main CI'ında koşar (tag normalde main'in
    # testten geçmiş ucundan atılır); pandoc entegrasyon testleri pandoc
    # yoksa skip edilir. derle.sh (TeX) testleri de bu kapıda skip olur;
    # onlar main CI'ının derle job'unda koşar.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Tag ↔ VERSION eşleşmesi
        shell: bash
        run: |
          V="$(grep VERSION core/version.py | cut -d'"' -f2)"
          if [ "v${V}" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} core/version.py ile uyusmuyor (orada v${V}). Önce version.py + pyproject + README'yi güncelle, sonra tag at."
            exit 1
          fi
          echo "Tag eşleşiyor: v${V}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (PyQt6 headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libgl1 libegl1 libglib2.0-0 \
            libdbus-1-3 libxkbcommon0 libfontconfig1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Get version
        id: ver
        shell: bash
        run: echo "VERSION=$(grep VERSION core/version.py | cut -d'"' -f2)" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt -r desktop/requirements-build.txt

      - name: Build exe
        working-directory: desktop
        run: python -m PyInstaller "LaTeX Editor.spec" --clean --noconfirm

      - name: Rename for release
        working-directory: desktop
        shell: bash
        run: mv "dist/LaTeX Editor.exe" "dist/LaTeX_Editor_v${{ steps.ver.outputs.VERSION }}_Windows.exe"

      - name: Generate release notes
        shell: bash
        run: |
          # actions/checkout tag push'ta refs/tags/<tag>'i dogrudan commit SHA'si ile
          # yazar (annotated tag hafifletilir, %(contents) commit mesajini verir);
          # gercek tag objesini cekip sonra oku.
          git fetch --no-tags --force origin "+refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          TAG_MSG=$(git tag -l --format='%(contents)' ${{ github.ref_name }})
          TAG_MSG=$(echo "$TAG_MSG" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          V="${{ steps.ver.outputs.VERSION }}"
          {
            echo "## What's Changed"
            echo ""
            echo "$TAG_MSG"
            echo ""
            echo "---"
            echo ""
            echo "## Installation"
            echo ""
            echo "> Warning: The app only includes the GUI. The LaTeX compiler (\`lualatex\`/\`pdflatex\`/\`xelatex\`) must be installed separately via **TeX Live**."
            echo ""
            echo "### Windows"
            echo "1. **Install WSL** (PowerShell, as administrator):"
            echo '   ```'
            echo "   wsl --install"
            echo '   ```'
            echo "2. **Install TeX Live in WSL:**"
            echo '   ```'
            echo "   sudo apt-get update"
            echo "   sudo apt-get install texlive-base texlive-binaries texlive-latex-base \\"
            echo "     texlive-latex-extra texlive-latex-recommended texlive-lang-european \\"
            echo "     texlive-luatex texlive-xetex texlive-fonts-extra texlive-science texlive-bibtex-extra \\"
            echo "     texlive-font-utils texlive-extra-utils biber texlive-publishers \\"
            echo "     texlive-humanities texlive-pstricks python3-pygments pandoc"
            echo '   ```'
            echo "3. Download \`LaTeX_Editor_v${V}_Windows.exe\` and run."
            echo ""
            echo "### Linux"
            echo "**Install TeX Live:**"
            echo '   ```'
            echo "   sudo apt-get update"
            echo "   sudo apt-get install texlive-base texlive-binaries texlive-latex-base \\"
            echo "     texlive-latex-extra texlive-latex-recommended texlive-lang-european \\"
            echo "     texlive-luatex texlive-xetex texlive-fonts-extra texlive-science texlive-bibtex-extra \\"
            echo "     texlive-font-utils texlive-extra-utils biber texlive-publishers \\"
            echo "     texlive-humanities texlive-pstricks libxcb-cursor0 python3-pygments pandoc"
            echo '   ```'
            echo "Download \`LaTeX_Editor_v${V}_Linux_x86_64.AppImage\`, \`chmod +x\` and run."
            echo ""
            echo "### Minimum installation (basic compilation only)"
            echo '   ```'
            echo "   sudo apt-get update"
            echo "   sudo apt-get install texlive-base texlive-binaries texlive-latex-base \\"
            echo "     texlive-latex-recommended texlive-luatex texlive-xetex libxcb-cursor0"
            echo '   ```'
            echo ""
            echo "---"
            echo ""
            echo "## Kurulum"
            echo ""
            echo "> Önemli: Uygulama yalnızca GUI'yi içerir. LaTeX derleyicisi (\`lualatex\`/\`pdflatex\`/\`xelatex\`) ayrıca **TeX Live** ile kurulmalıdır."
            echo ""
            echo "### Windows"
            echo "1. **WSL kur** (PowerShell, yönetici olarak):"
            echo '   ```'
            echo "   wsl --install"
            echo '   ```'
            echo "2. **WSL içinde TeX Live kur:**"
            echo '   ```'
            echo "   sudo apt-get update"
            echo "   sudo apt-get install texlive-base texlive-binaries texlive-latex-base \\"
            echo "     texlive-latex-extra texlive-latex-recommended texlive-lang-european \\"
            echo "     texlive-luatex texlive-xetex texlive-fonts-extra texlive-science texlive-bibtex-extra \\"
            echo "     texlive-font-utils texlive-extra-utils biber texlive-publishers \\"
            echo "     texlive-humanities texlive-pstricks python3-pygments pandoc"
            echo '   ```'
            echo "3. \`LaTeX_Editor_v${V}_Windows.exe\`'yi indir ve çalıştır."
            echo ""
            echo "### Linux"
            echo "**TeX Live kur:**"
            echo '   ```'
            echo "   sudo apt-get update"
            echo "   sudo apt-get install texlive-base texlive-binaries texlive-latex-base \\"
            echo "     texlive-latex-extra texlive-latex-recommended texlive-lang-european \\"
            echo "     texlive-luatex texlive-xetex texlive-fonts-extra texlive-science texlive-bibtex-extra \\"
            echo "     texlive-font-utils texlive-extra-utils biber texlive-publishers \\"
            echo "     texlive-humanities texlive-pstricks libxcb-cursor0 python3-pygments pandoc"
            echo '   ```'
            echo "\`LaTeX_Editor_v${V}_Linux_x86_64.AppImage\`'i indir, \`chmod +x\` yapip calistir."
            echo ""
            echo "### Minimum kurulum (sadece temel derleme)"
            echo '   ```'
            echo "   sudo apt-get update"
            echo "   sudo apt-get install texlive-base texlive-binaries texlive-latex-base \\"
            echo "     texlive-latex-recommended texlive-luatex texlive-xetex libxcb-cursor0"
            echo '   ```'
            echo ""
            echo "---"
            echo ""
            echo "For detailed usage see [README](https://github.com/s-balli/latex-editor#readme)."
            echo "Detaylı kullanım için [README.tr.md](https://github.com/s-balli/latex-editor/blob/main/README.tr.md)."
          } > release-notes.md

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/LaTeX_Editor_v${{ steps.ver.outputs.VERSION }}_Windows.exe
          name: LaTeX Editor v${{ steps.ver.outputs.VERSION }}
          body_path: release-notes.md
          fail_on_unmatched_files: true

  build-linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: ver
        shell: bash
        run: echo "VERSION=$(grep VERSION core/version.py | cut -d'"' -f2)" >> $GITHUB_OUTPUT

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv inkscape \
            libxcb-cursor0 libgl1 libegl1 libglib2.0-0 \
            libdbus-1-3 libxkbcommon0 libfontconfig1

      - name: Build AppImage
        working-directory: desktop
        run: bash build_appimage.sh

      - name: Generate release notes
        shell: bash
