name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    # Tag'lenen kod testleri geçmeden artifact üretilmesin. ci.yml yalnız
    # main push'unda/PR'da koşar; tag push'u orayı tetiklemez, release.yml
    # kendi testini koymadıkça testleri hiç geçmemiş bir komitten de release
    # çıkabilir. Kasıtlı olarak yalnız tek Python sürümü ve pandoc'suz:
    # matris + güncel pandoc zaten main CI'ında koşar (tag normalde main'in
    # testten geçmiş ucundan atılır); pandoc entegrasyon testleri pandoc
    # yoksa skip edilir. derle.sh (TeX) testleri de bu kapıda skip olur;
    # onlar main CI'ının derle job'unda koşar.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Tag ↔ VERSION eşleşmesi
        shell: bash
        run: |
          V="$(grep VERSION core/version.py | cut -d'"' -f2)"
          if [ "v${V}" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} core/version.py ile uyusmuyor (orada v${V}). Önce version.py + pyproject + README'yi güncelle, sonra tag at."
            exit 1
          fi
          echo "Tag eşleşiyor: v${V}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Onbellekteki .deb'leri apt'nin arsivine koy: apt indirmek yerine
      # bunlari kullanir. `-n`: var olanin ustune yazma.
      # Anahtardaki "v1" ELLE artirilmali paket listesi degisirse, yoksa
      # eksik paket eski onbellekten gelmis gibi gorunur.
      - name: APT paket onbellegi
        uses: actions/cache@v4
        with:
          path: ~/apt-arsiv
          key: apt-pyqt-ubuntu-22.04-v1

      - name: Install system dependencies (PyQt6 headless)
        run: |
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/99onbellek > /dev/null
          mkdir -p ~/apt-arsiv
          sudo cp -n ~/apt-arsiv/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libgl1 libegl1 libglib2.0-0 \
            libdbus-1-3 libxkbcommon0 libfontconfig1

      # apt kurulumdan SONRA .deb'leri siliyor, o yuzden Keep-Downloaded sart.
      # actions/cache is sonunda ~/apt-arsiv'i kendiliginden sakliyor.
      - name: Paketleri onbellege al
        run: |
          mkdir -p ~/apt-arsiv
          sudo cp -n /var/cache/apt/archives/*.deb ~/apt-arsiv/ 2>/dev/null || true
          sudo chown -R "$USER" ~/apt-arsiv
          echo "onbellekteki paket: $(ls ~/apt-arsiv/*.deb 2>/dev/null | wc -l)"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Get version
        id: ver
        shell: bash
        run: echo "VERSION=$(grep VERSION core/version.py | cut -d'"' -f2)" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt -r desktop/requirements-build.txt

      - name: Build exe
        working-directory: desktop
        run: python -m PyInstaller "LaTeX Editor.spec" --clean --noconfirm

      - name: Rename for release
        working-directory: desktop
        shell: bash
        run: mv "dist/LaTeX Editor.exe" "dist/LaTeX_Editor_v${{ steps.ver.outputs.VERSION }}_Windows.exe"

      - name: Generate release notes
        shell: bash
        run: |
          # Gövde TEK KAYNAKTA: scripts/release_notes.sh. Eskiden bu adım
          # build-windows ve build-linux'ta ~100 satır olarak KOPYALANMIŞTI;
          # ikisi birebir aynıydı ama aynı kalmalarını hiçbir şey güvence
          # altına almıyordu (kurulum listesi bir kez sürüklenmişti bile).
          #
          # actions/checkout tag push'ta refs/tags/<tag>'i doğrudan commit
          # SHA'sı ile yazar (annotated tag hafifletilir, %(contents) commit
          # mesajını verir); gerçek tag objesini çekip sonra oku.
          git fetch --no-tags --force origin "+refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          git tag -l --format='%(contents)' "${{ github.ref_name }}" \
            | bash scripts/release_notes.sh "${{ steps.ver.outputs.VERSION }}" \
            > release-notes.md

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/LaTeX_Editor_v${{ steps.ver.outputs.VERSION }}_Windows.exe
          name: LaTeX Editor v${{ steps.ver.outputs.VERSION }}
          body_path: release-notes.md
          fail_on_unmatched_files: true

  build-linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # AppImage'a GÖMÜLEN yorumlayıcı budur. Bu adım YOKKEN build_appimage.sh
      # runner'ın sistem python3'ünü kullanıyordu (ubuntu-22.04'te 3.10), yani
      # kullanıcıya giden sürüm, runner imajının tesadüfüne bağlıydı. Oysa
      # README "Python 3.12+" diyor, Windows exe'si de 3.12 ile paketleniyor.
      # ubuntu-22.04 BİLEREK korunuyor: AppImage'ın glibc tabanını belirliyor
      # (24.04'e geçmek eski dağıtımlarda çalışmamasına yol açar).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gömülecek yorumlayıcı
        run: python3 --version

      - name: Get version
        id: ver
        shell: bash
        run: echo "VERSION=$(grep VERSION core/version.py | cut -d'"' -f2)" >> $GITHUB_OUTPUT

      # Onbellekteki .deb'leri apt'nin arsivine koy: apt indirmek yerine
      # bunlari kullanir. `-n`: var olanin ustune yazma.
      # Anahtardaki "v1" ELLE artirilmali paket listesi degisirse, yoksa
      # eksik paket eski onbellekten gelmis gibi gorunur.
      - name: APT paket onbellegi
        uses: actions/cache@v4
        with:
          path: ~/apt-arsiv
          key: apt-appimage-ubuntu-22.04-v2

      - name: Install system dependencies
        run: |
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/99onbellek > /dev/null
          mkdir -p ~/apt-arsiv
          sudo cp -n ~/apt-arsiv/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv inkscape \
            libxcb-cursor0 libgl1 libegl1 libglib2.0-0 \
            libdbus-1-3 libxkbcommon0 libfontconfig1 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-xkb1

      # ALTTAKI DORT PAKET AppImage'IN ACILMASI ICIN SART. Qt'nin xcb
      # platform eklentisi onlara bagli ve PyInstaller yalniz YAPIM SIRASINDA
      # SISTEMDE BULABILDIGI kutuphaneleri paketliyor; kurulu olmayanlari
      # sessizce atliyor. Yoklarken uretilen AppImage, o paketleri tasimayan
      # her Linux'ta COKUYORDU:
      #   qt.qpa.plugin: Could not load the Qt platform plugin "xcb"
      #   cikis kodu 134, core dumped
      # Dordunun de onceligi `optional`/`extra`, yani temel kurulumda YOKLAR;
      # gelistirici makinelerinde bulunduklari icin kusur gorunmuyordu.
      # OLCULDU (2026-09-04, temiz Ubuntu 24.04): paketler kuruluyken yapilan
      # surum aciliyor, kurulu degilken cokuyor. Toplam maliyet 66 KB.

      # apt kurulumdan SONRA .deb'leri siliyor, o yuzden Keep-Downloaded sart.
      # actions/cache is sonunda ~/apt-arsiv'i kendiliginden sakliyor.
      - name: Paketleri onbellege al
        run: |
          mkdir -p ~/apt-arsiv
          sudo cp -n /var/cache/apt/archives/*.deb ~/apt-arsiv/ 2>/dev/null || true
          sudo chown -R "$USER" ~/apt-arsiv
          echo "onbellekteki paket: $(ls ~/apt-arsiv/*.deb 2>/dev/null | wc -l)"

      - name: Build AppImage
        working-directory: desktop
        run: bash build_appimage.sh

      # AppImage KENDI KENDINE YETIYOR MU. Qt'nin xcb eklentisi cozulemeyen
      # bir bagimlilik tasiyorsa uygulama, o kutuphaneyi tasimayan sistemde
      # hic acilmiyor; hata da Qt'nin anlasilmaz "could not load the Qt
      # platform plugin" mesaji oluyor. Bir kez yasandi (2026-09-04): dort
      # X11 kutuphanesi yapim makinesinde kurulu olmadigi icin PyInstaller
      # onlari sessizce atlamis, uretilen AppImage temiz Ubuntu'da cokuyordu.
      #
      # Bu kapi yalnizca EKSIK PAKETI degil, PyQt6 yukseltmesinin getirdigi
      # YENI bir sistem bagimliligini da yakalar. Yayindan once, burada.
      - name: AppImage bagimliliklari cozuluyor mu
        working-directory: desktop
        run: |
          eklenti=$(find dist/latex-editor/_internal -name libqxcb.so | head -1)
          test -n "$eklenti" || { echo "::error::libqxcb.so bulunamadi"; exit 1; }
          eksik=$(LD_LIBRARY_PATH="$PWD/dist/latex-editor/_internal" \
                  ldd "$eklenti" | grep "not found" || true)
          if [ -n "$eksik" ]; then
            echo "::error::AppImage kendi kendine yetmiyor, eksik kutuphaneler:"
            echo "$eksik"
            echo "Cozum: eksik paketleri yukaridaki apt listesine ekleyin ve"
            echo "onbellek anahtarindaki surumu artirin."
            exit 1
          fi
          echo "xcb eklentisinin butun bagimliliklari cozuluyor"

      - name: Generate release notes
        shell: bash
        run: |
          # Gövde TEK KAYNAKTA: scripts/release_notes.sh. Eskiden bu adım
          # build-windows ve build-linux'ta ~100 satır olarak KOPYALANMIŞTI;
          # ikisi birebir aynıydı ama aynı kalmalarını hiçbir şey güvence
          # altına almıyordu (kurulum listesi bir kez sürüklenmişti bile).
          #
          # actions/checkout tag push'ta refs/tags/<tag>'i doğrudan commit
          # SHA'sı ile yazar (annotated tag hafifletilir, %(contents) commit
          # mesajını verir); gerçek tag objesini çekip sonra oku.
          git fetch --no-tags --force origin "+refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          git tag -l --format='%(contents)' "${{ github.ref_name }}" \
            | bash scripts/release_notes.sh "${{ steps.ver.outputs.VERSION }}" \
            > release-notes.md

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/LaTeX_Editor_v${{ steps.ver.outputs.VERSION }}_Linux_x86_64.AppImage
            desktop/dist/LaTeX_Editor_v${{ steps.ver.outputs.VERSION }}_Linux_x86_64.AppImage.zsync
          name: LaTeX Editor v${{ steps.ver.outputs.VERSION }}
          body_path: release-notes.md
          fail_on_unmatched_files: true

  # Yayin cikinca winget-pkgs'e surum yukseltme PR'i ac. Ilk surum (1.0.19)
  # ELLE gonderildi (microsoft/winget-pkgs#429063); bu eylem yalniz var olan
  # bir paketi guncelleyebiliyor, paket yoksa hata verip duruyor.
  #
  # NEDEN build-windows'a BAGLI: eylem yayindaki varliklari GitHub API'sinden
  # okuyup adreslerini komac'a veriyor. Once kosarsa .exe henuz yuklenmemis
  # olur ve installers-regex hicbir sey bulamaz.
  #
  # NEDEN AYRI IS: build-windows duserse winget'e yanlis surum bildirilmesin.
  #
  # TOKEN: GITHUB_TOKEN YETMEZ. Eylem baska bir depoya (microsoft/winget-pkgs
  # catalinizA) yaziyor; is akisinin kendi jetonu yalniz bu depoda gecerli.
  # WINGET_TOKEN sirri, `public_repo` yetkili klasik bir kisisel erisim
  # jetonu olmali. Sir tanimli degilse is SESSIZCE ATLANIYOR: yayin akisinin
  # tamami winget yuzunden kirmizi olmasin.
  winget:
    needs: build-windows
    runs-on: ubuntu-latest
    # SURUMU ENGELLEMEZ. winget yayina EK bir kanal; surumun kendisi ondan
    # bagimsiz ve dosyalar bu is kosmadan once zaten yuklenmis oluyor.
    # Token yokken isi atlamanin gerekcesi neyse bu da o: yayin akisinin
    # tamami winget yuzunden kirmizi olmasin.
    #
    # SU AN ONEMLI: paket winget-pkgs'te HENUZ YOK (ilk PR moderator onayi
    # bekliyor, olculdu: yeni paket kuyrugunun ortancasi ~7 gun). Eylem
    # paketi bulamayinca hata verip duruyor, yani o gun gelene kadar HER
    # surum bu isten kirmizi donerdi.
    #
    # Basarisizlik GIZLENMIYOR: is listede sari uyariyla duruyor, yalnizca
    # akisi durdurmuyor. Paket kabul edildikten sonra o surumun `winget`
    # isini Actions ekranindan tek basina yeniden calistirmak yeterli;
    # eylem yayin bilgisini API'den okuyor, yayin zaten yerinde.
    continue-on-error: true
    # env IS DUZEYINDE, adim duzeyinde DEGIL: `secrets` baglami adim `if`inde
    # kullanilamiyor (GitHub'in izin verdigi baglamlar arasinda yok), adimin
    # KENDI env'i de kendi `if`inde guvenilir gorunmuyor. Is duzeyine konunca
    # ikisi de cozuluyor.
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: WinGet'e surum bildir
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: s-balli.LaTeXEditor
          # Yalniz Windows .exe. AppImage ve .zsync zaten eslesmiyor ama
          # desen acikca yaziliyor: yayina ilerde baska bir .exe girerse
          # (ornegin bir kurulum programi) yanlislikla gonderilmesin.
          installers-regex: '_Windows\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
