name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # requires-python >=3.10: en eski desteklenen + güncel
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (PyQt6 headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libgl1 libegl1 libglib2.0-0 \
            libdbus-1-3 libxkbcommon0 libfontconfig1

      # Sürüm SABİT ve adres DOĞRUDAN: eskiden her koşuda
      # api.github.com/repos/jgm/pandoc/releases/latest çağrılıyordu. Kimliksiz
      # API isteği saatlik kotaya tabi ve runner IP'leri paylaşımlı; kota
      # dolduğunda üç deneme de boş dönüp CI testlere hiç gelmeden düşüyordu
      # (2026-08-30, run 33330237247). Tekrar döngüsü ağ takılmasını kurtarır,
      # kota aşımını kurtarmaz. Ayrıca "latest" ile pandoc her yükseldiğinde
      # test ortamı habersiz değişiyordu — sabit sürüm tekrarlanabilir.
      # Ubuntu deposundaki pandoc (22.04'te 2.9) YETMEZ: exporter
      # --embed-resources (pandoc 3.0+) ve --citeproc kullanıyor.
      # Yükseltmek için: PANDOC_VERSION'ı değiştir, başka yeri elleme.
      - name: Install pandoc (exporter --embed-resources/--citeproc gerektirir)
        env:
          PANDOC_VERSION: "3.11"
        run: |
          set -e
          URL="https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          curl -sfL --retry 5 --retry-all-errors --connect-timeout 15 -o /tmp/pandoc.deb "$URL"
          sudo dpkg -i /tmp/pandoc.deb
          # Kurulan sürüm sabitlenenle aynı mı — sessiz sapma olmasın
          KURULU="$(pandoc --version | head -1 | awk '{print $2}')"
          echo "pandoc $KURULU"
          if [ "$KURULU" != "$PANDOC_VERSION" ]; then
            echo "::error::pandoc $PANDOC_VERSION bekleniyordu, $KURULU kuruldu"
            exit 1
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pytest

      - name: Bagimlilik surumleri kaydi (ODR B3)
        run: pip freeze | grep -iE "pyqt6|qscintilla|pypdfium|pillow|send2trash|dulwich|pytest"

      - name: Lint (ruff)
        run: |
          pip install "ruff==0.16.2"
          ruff check desktop/ core/ tests/

      - name: EN çeviriler tamamlanmış mı
        run: |
          if grep -q 'type="unfinished"' desktop/translations/latexeditor_en.ts; then
            echo "latexeditor_en.ts içinde unfinished çeviri var:"
            grep -c 'type="unfinished"' desktop/translations/latexeditor_en.ts
            echo "Düzeltme: PATH=/usr/lib/qt6/bin:\$PATH bash scripts/update_translations.sh + EN doldurma"
            exit 1
          fi

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q


  # ---------------------------------------------------------------------
  # GEÇİCİ — düzeltmenin (4d96f4d) işe yaradığını istatistiksel olarak
  # doğrulamak için. Sonuç alınınca bu job SİLİNECEK (PR birleştirilmeyecek).
  #
  # Hatalı hâlde ölçülen oran 3/10 (PR #1, A grubu). p≈0.25 alırsak düzeltme
  # işe yaramamışsa 20 turun HEPSİNİN temiz gelme olasılığı 0.75^20 ≈ %0.3.
  # Yani 0/20 sonucu ~%99.7 güven demek; tek CI koşusu, ~10 dakika.
  #
  # Job kırmızı yanmaz: amaç sayı toplamak.
  # ---------------------------------------------------------------------
  duzeltme-dogrulama:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies (PyQt6 headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libgl1 libegl1 libglib2.0-0 \
            libdbus-1-3 libxkbcommon0 libfontconfig1

      # Kırmızı koşulardaki ortamla AYNI olsun diye pandoc da kuruluyor:
      # yoksa 12 test skip olur ve suite'in ZAMANLAMASI değişir.
      - name: Install pandoc
        env:
          PANDOC_VERSION: "3.11"
        run: |
          set -e
          URL="https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          curl -sfL --retry 5 --retry-all-errors --connect-timeout 15 -o /tmp/pandoc.deb "$URL"
          sudo dpkg -i /tmp/pandoc.deb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pytest

      - name: Sürümler
        run: pip freeze | grep -iE "pyqt6|qscintilla|dulwich|pytest"

      # Kapının boş koşmadığının kanıtı: temizlik fixture'ı GERÇEKTEN devrede mi?
      - name: Fixture devrede mi (kapı boş koşmasın)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/test_qt_yasam_dongusu.py -q
          grep -q "autouse=True" tests/conftest.py
          echo "temizlik fixture'i devrede"

      - name: Tam suite x20 — segfault sayımı
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          seg=0; dus=0
          for i in $(seq 1 20); do
            python -m pytest tests/ -q -p no:cacheprovider > /tmp/d$i.log 2>&1 || dus=$((dus+1))
            if grep -q "Segmentation fault" /tmp/d$i.log; then
              seg=$((seg+1))
              echo "--- tur $i: SEGFAULT ---"
              grep -A 4 "Current thread" /tmp/d$i.log | head -6
            fi
          done
          echo "SONUC segfault=$seg/20  dusen=$dus/20"
          echo "(hatali halde olculen: 3/10 — bkz. PR #1)"

      - name: Logları artefakt olarak yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dogrulama-loglari
          path: /tmp/d*.log
          if-no-files-found: ignore

  test-windows:
    # Windows uygulamanın BİRİNCİL hedefi — release bir Windows exe'si üretiyor
    # — ama test paketi 2026-08-31'e kadar Windows'ta HİÇ koşmadı: ci.yml
    # ubuntu-only, release.yml'in windows job'ı yalnız exe derliyor, geliştirme
    # araç zinciri WSL'de. Yani Windows'a özgü regresyonu hiçbir kapı tutmuyordu.
    # Depoda bu sınıfın geçmişi yoğun: kodlama (cp1254 çözme hataları),
    # wsl.exe'nin UTF-16 çıktısı, UNC/`\\wsl.localhost` yol çevirisi, pandoc'un
    # yalnız WSL'de olması, satır sonu (CRLF) davranışı. Ubuntu CI bu sınıfı
    # yapısal olarak göremez.
    #
    # KAPSAM: pandoc / TeX Live / POSIX bash KURULMUYOR. Onlara bağlı testler
    # kendiliğinden skip olur — bu job yazılırken 55 tane (TeX 39, pandoc 12,
    # bash 3, Windows'ta anlamsız olan 1) — geriye 1014 test kalıyor ve amaç
    # zaten onlar: yol, kodlama, satır sonu, subprocess davranışı. TeX/pandoc
    # kapsaması ubuntu job'larında var; Windows runner dakikası 2× sayıldığı
    # için burada tekrarlanmıyor. Aynı sebeple tek Python sürümü ve lint/çeviri
    # kapıları yok (platformdan bağımsız, matrix job'da koşuyor).
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # release.yml'deki build-windows job'ı ile AYNI sürüm: exe hangi
          # yorumlayıcıyla paketleniyorsa testler de onunla koşsun
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r desktop/requirements.txt pytest

      # derle job'ındaki "command -v synctex || exit 1" kapısının Windows
      # karşılığı. pip kurulumu BAŞARILI görünüp Qt DLL'leri yüklenemeyebilir
      # (bu depoda birebir yaşandı: bir Windows kurulumunda PyQt6 import
      # edilebiliyor ama QtCore "DLL load failed" veriyor). O durumda GUI test
      # modülleri toplu skip olur ve job hiçbir şey koşmadan YEŞİL geçer —
      # D4'te öğrenilen ders. Import'u önden patlat.
      - name: Bağımlılıklar gerçekten yüklenebiliyor mu
        run: python -c "import PyQt6.QtWidgets, PyQt6.Qsci, pypdfium2, PIL, send2trash, dulwich; print('ok')"

      # BİLGİ AMAÇLI, kapı DEĞİL. Windows/WSL köprüsünün GERÇEK wsl.exe'ye
      # karşı koştuğu bir job yok: ubuntu runner'da WSL kavramı yok, windows
      # runner'ında da dağıtım kurulu değil. tests/test_wsl_koprusu.py bu
      # yüzden ölçülmüş bir sözleşmeye karşı, PATH'e konan gerçek ama sahte
      # bir `wsl` ile koşuyor (yalnız POSIX job'larında; Windows'ta
      # CreateProcess uzantısız adı `.exe` diye arar, gölgelenemez).
      # Bu adım boşluğu LOG'DA görünür tutuyor — runner imajına bir gün WSL
      # gelirse burada fark edilir ve gerçek entegrasyon testi eklenebilir.
      - name: WSL durumu (köprü testinin kapsam sınırı — bilgi)
        shell: pwsh
        run: |
          $c = Get-Command wsl -ErrorAction SilentlyContinue
          if ($null -eq $c) { Write-Host 'wsl.exe YOK'; exit 0 }
          Write-Host "wsl.exe: $($c.Source)"
          $liste = (& wsl -l -q) -join ', '
          Write-Host "dagitimlar: [$liste] (exit=$LASTEXITCODE)"
          Write-Host 'Gercek WSL entegrasyon testi hicbir CI jobunda KOSMUYOR.'
          exit 0

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

  derle:
    # GERÇEK TeX gerektiren entegrasyon testleri: matrix job'da TeX
    # kurulmadığından ikisi de orada hep skip oluyor, yani yalnız
    # geliştirici makinesinde deneniyordu.
    #   test_derle_sh.py     — derleme betiği zinciri
    #   test_synctex_live.py — ileri/geri arama, koordinat→piksel, highlight
    # Paket seti test belgelerinin gerçek bağımlılıkları: article
    # (latex-base), fontspec (latex-recommended), biblatex+biber
    # (bibtex-extra), minted+Pygments (latex-extra + python3-pygments);
    # üç motor da motor testlerinde gerekli. synctex ikilisi texlive-binaries'te.
    # test_synctex_live gerçek PdfViewer kullandığı için PyQt6 + headless
    # sistem kütüphaneleri de kuruluyor (pandoc gerekmez).
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: TeX Live kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-luatex texlive-xetex texlive-bibtex-extra texlive-binaries \
            biber python3-pygments
          lualatex --version | head -1
          kpsewhich minted.sty && command -v biber pygmentize
          # synctex ŞART: yoksa test_synctex_live pytestmark ile komple skip
          # olur ve bu job onu koşturuyormuş gibi sessizce yeşil geçer.
          command -v synctex || { echo "::error::synctex bulunamadı"; exit 1; }

      - name: Install system dependencies (PyQt6 headless)
        run: |
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libgl1 libegl1 libglib2.0-0 \
            libdbus-1-3 libxkbcommon0 libfontconfig1

      - name: Install Python dependencies
        run: pip install -r desktop/requirements.txt pytest

      - name: Gerçek TeX entegrasyon testleri (derle.sh + SyncTeX)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_derle_sh.py tests/test_synctex_live.py -v
