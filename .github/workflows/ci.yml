name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # requires-python >=3.10: en eski desteklenen + güncel
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          # Tanıtım sayfası kapısı git tarihini okuyor (bkz.
          # tests/test_install_lists.py). Öntanımlı sığ klonda kapı
          # sessizce atlanıyor; tarihin tamamı 8 MiB, bedeli yok.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (PyQt6 headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libgl1 libegl1 libglib2.0-0 \
            libdbus-1-3 libxkbcommon0 libfontconfig1

      # Sürüm SABİT ve adres DOĞRUDAN: eskiden her koşuda
      # api.github.com/repos/jgm/pandoc/releases/latest çağrılıyordu. Kimliksiz
      # API isteği saatlik kotaya tabi ve runner IP'leri paylaşımlı; kota
      # dolduğunda üç deneme de boş dönüp CI testlere hiç gelmeden düşüyordu
      # (2026-08-30, run 33330237247). Tekrar döngüsü ağ takılmasını kurtarır,
      # kota aşımını kurtarmaz. Ayrıca "latest" ile pandoc her yükseldiğinde
      # test ortamı habersiz değişiyordu — sabit sürüm tekrarlanabilir.
      # Ubuntu deposundaki pandoc (22.04'te 2.9) YETMEZ: exporter
      # --embed-resources (pandoc 3.0+) ve --citeproc kullanıyor.
      # Yükseltmek için: PANDOC_VERSION'ı değiştir, başka yeri elleme.
      - name: Install pandoc (exporter --embed-resources/--citeproc gerektirir)
        env:
          PANDOC_VERSION: "3.11"
        run: |
          set -e
          URL="https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          curl -sfL --retry 5 --retry-all-errors --connect-timeout 15 -o /tmp/pandoc.deb "$URL"
          sudo dpkg -i /tmp/pandoc.deb
          # Kurulan sürüm sabitlenenle aynı mı — sessiz sapma olmasın
          KURULU="$(pandoc --version | head -1 | awk '{print $2}')"
          echo "pandoc $KURULU"
          if [ "$KURULU" != "$PANDOC_VERSION" ]; then
            echo "::error::pandoc $PANDOC_VERSION bekleniyordu, $KURULU kuruldu"
            exit 1
          fi

      # python-docx UYGULAMANIN bagimliligi DEGIL, yalniz testin: uretilen
      # .docx'i acip bozulmadigini dogrulayan tek kapi onu istiyor
      # (test_exporter.py::test_docx_opens_after_fix). Kurulu olmadigi icin
      # o kapi UC CI isinde de atlaniyordu, yani "Word dosyayi acabiliyor mu"
      # sorusu hicbir yerde olculmuyordu.
      # Pillow da 2026-09-30'dan beri UYGULAMANIN bagimliligi DEGIL: PDF
      # testleri PDFium'un kendi `to_pil` ciktisini kehanet olarak kullaniyor.
      # Bu dosyadaki uc kurulum ve release.yml'in test isi onu ayrica kuruyor;
      # paketlere girmiyor (spec excludes, scripts/paket_dogrula.py).
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pytest python-docx Pillow

      - name: Bagimlilik surumleri kaydi (ODR B3)
        run: pip freeze | grep -iE "pyqt6|qscintilla|pypdfium|pillow|send2trash|dulwich|spylls|pytest"

      # GUVENLIK DANISMASI. Dependabot masaustu bagimliliklarini GORMUYOR:
      # requirements.txt aralik veriyor, bagimlilik grafigi paketleri
      # surumsuz listeliyor ve uyari uretmiyor. Olculdu (2026-09-30):
      # yayinlanan paketler Pillow 11.3.0 tasiyordu, 13 danismasi vardi,
      # depoda uyari 0. pip-audit gereksinimleri ayri bir ortamda COZUP pakete
      # girecek tam surumleri PyPI'nin danisma verisiyle karsilastiriyor;
      # bilinen acik varsa is duser. Yalniz 3.12'de: paketler onunla
      # uretiliyor. Test kurulumu (pytest, Pillow) denetlenmiyor, pakete
      # girmiyor.
      - name: Pakete giren surumlerde bilinen acik var mi (pip-audit)
        if: matrix.python-version == '3.12'
        run: |
          pip install "pip-audit==2.10.1"
          pip-audit --progress-spinner off -r desktop/requirements.txt -r desktop/requirements-build.txt

      - name: Lint (ruff)
        run: |
          pip install "ruff==0.16.2"
          ruff check desktop/ core/ tests/

      - name: EN çeviriler tamamlanmış mı
        run: |
          if grep -q 'type="unfinished"' desktop/translations/latexeditor_en.ts; then
            echo "latexeditor_en.ts içinde unfinished çeviri var:"
            grep -c 'type="unfinished"' desktop/translations/latexeditor_en.ts
            echo "Düzeltme: PATH=/usr/lib/qt6/bin:\$PATH bash scripts/update_translations.sh + EN doldurma"
            exit 1
          fi

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

  test-windows:
    # Windows uygulamanın BİRİNCİL hedefi — release bir Windows exe'si üretiyor
    # — ama test paketi 2026-08-31'e kadar Windows'ta HİÇ koşmadı: ci.yml
    # ubuntu-only, release.yml'in windows job'ı yalnız exe derliyor, geliştirme
    # araç zinciri WSL'de. Yani Windows'a özgü regresyonu hiçbir kapı tutmuyordu.
    # Depoda bu sınıfın geçmişi yoğun: kodlama (cp1254 çözme hataları),
    # wsl.exe'nin UTF-16 çıktısı, UNC/`\\wsl.localhost` yol çevirisi, pandoc'un
    # yalnız WSL'de olması, satır sonu (CRLF) davranışı. Ubuntu CI bu sınıfı
    # yapısal olarak göremez.
    #
    # KAPSAM: pandoc / TeX Live / POSIX bash KURULMUYOR. Onlara bağlı testler
    # kendiliğinden skip olur — bu job yazılırken 55 tane (TeX 39, pandoc 12,
    # bash 3, Windows'ta anlamsız olan 1) — geriye 1014 test kalıyor ve amaç
    # zaten onlar: yol, kodlama, satır sonu, subprocess davranışı. TeX/pandoc
    # kapsaması ubuntu job'larında var; Windows runner dakikası 2× sayıldığı
    # için burada tekrarlanmıyor. Aynı sebeple tek Python sürümü ve lint/çeviri
    # kapıları yok (platformdan bağımsız, matrix job'da koşuyor).
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Tanıtım sayfası kapısı git tarihini okuyor (bkz.
          # tests/test_install_lists.py). Öntanımlı sığ klonda kapı
          # sessizce atlanıyor; tarihin tamamı 8 MiB, bedeli yok.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # release.yml'deki build-windows job'ı ile AYNI sürüm: exe hangi
          # yorumlayıcıyla paketleniyorsa testler de onunla koşsun
          python-version: '3.12'

      # Pillow yalniz testlerin kehaneti (bkz. test isindeki not).
      - name: Install Python dependencies
        run: pip install -r desktop/requirements.txt pytest Pillow

      # derle job'ındaki "command -v synctex || exit 1" kapısının Windows
      # karşılığı. pip kurulumu BAŞARILI görünüp Qt DLL'leri yüklenemeyebilir
      # (bu depoda birebir yaşandı: bir Windows kurulumunda PyQt6 import
      # edilebiliyor ama QtCore "DLL load failed" veriyor). O durumda GUI test
      # modülleri toplu skip olur ve job hiçbir şey koşmadan YEŞİL geçer —
      # D4'te öğrenilen ders. Import'u önden patlat.
      - name: Bağımlılıklar gerçekten yüklenebiliyor mu
        run: python -c "import PyQt6.QtWidgets, PyQt6.Qsci, pypdfium2, PIL, send2trash, dulwich; print('ok')"

      # BİLGİ AMAÇLI, kapı DEĞİL. Windows/WSL köprüsünün GERÇEK wsl.exe'ye
      # karşı koştuğu bir job yok: ubuntu runner'da WSL kavramı yok, windows
      # runner'ında da dağıtım kurulu değil. tests/test_wsl_koprusu.py bu
      # yüzden ölçülmüş bir sözleşmeye karşı, PATH'e konan gerçek ama sahte
      # bir `wsl` ile koşuyor (yalnız POSIX job'larında; Windows'ta
      # CreateProcess uzantısız adı `.exe` diye arar, gölgelenemez).
      # Bu adım boşluğu LOG'DA görünür tutuyor — runner imajına bir gün WSL
      # gelirse burada fark edilir ve gerçek entegrasyon testi eklenebilir.
      - name: WSL durumu (köprü testinin kapsam sınırı — bilgi)
        shell: pwsh
        run: |
          $c = Get-Command wsl -ErrorAction SilentlyContinue
          if ($null -eq $c) { Write-Host 'wsl.exe YOK'; exit 0 }
          Write-Host "wsl.exe: $($c.Source)"
          $liste = (& wsl -l -q) -join ', '
          Write-Host "dagitimlar: [$liste] (exit=$LASTEXITCODE)"
          Write-Host 'Gercek WSL entegrasyon testi hicbir CI jobunda KOSMUYOR.'
          exit 0

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

  derle:
    # GERÇEK TeX gerektiren entegrasyon testleri: matrix job'da TeX
    # kurulmadığından ikisi de orada hep skip oluyor, yani yalnız
    # geliştirici makinesinde deneniyordu.
    #   test_derle_sh.py       — derleme betiği zinciri
    #   test_synctex_live.py   — ileri/geri arama, koordinat→piksel, highlight
    #   test_tablo_derleme.py  — tablo sihirbazının ÜRETTİĞİ blok derleniyor mu
    #                            (düzensiz CSV satırı ve hücredeki `^` ikisi de
    #                            derlemeyi kırıyordu; dizge testi yakalayamaz)
    #   test_ipucu_derleme.py  — hata ipucu GERÇEKTEN tanımsız olan komutu mu
    #                            gösteriyor (pdflatex bağlam satırını suçlu
    #                            komuttan sonra kesiyor; kod ilkini alıyordu)
    #   test_pdf_baglanti_derleme.py : iç bağlantı hedefe mi götürüyor
    #                            (pdflscape ile /Rotate 90 sayfa; hedefin yeri
    #                            render edilen piksellerden okunuyor)
    #   test_kaynakca_derleme.py : DOI ile eklenen kaynak iki motorda da
    #                            derleniyor mu (Crossref'in κ, ₂ ve <sub>2</sub>
    #                            başlıkları pdflatex'i düşürüyor, lualatex'te
    #                            sessizce kayboluyordu)
    # Paket seti test belgelerinin gerçek bağımlılıkları: article
    # (latex-base), fontspec (latex-recommended), biblatex+biber
    # (bibtex-extra), minted+Pygments (latex-extra + python3-pygments);
    # üç motor da motor testlerinde gerekli. synctex ikilisi texlive-binaries'te.
    # test_synctex_live gerçek PdfViewer kullandığı için PyQt6 + headless
    # sistem kütüphaneleri de kuruluyor (pandoc gerekmez).
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Tanıtım sayfası kapısı git tarihini okuyor (bkz.
          # tests/test_install_lists.py). Öntanımlı sığ klonda kapı
          # sessizce atlanıyor; tarihin tamamı 8 MiB, bedeli yok.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # TeX Live paketleri birkac yuz MB. Indirme suresi kosucunun apt
      # aynasina bagli ve OLCULDU (2026-09-02, 12 kosu): ortanca 68 sn, ama
      # uc kez 120, 256 ve 364+ sn surdu. Ayni kosularda test suresi 20-26 sn
      # SABITTI, yani dalgalanma tamamen indirmede. .deb'ler onbellege
      # alininca indirme tekrarlanmiyor.
      #
      # Anahtarda "v1" var: paket listesi degisirse elle artirilmali, yoksa
      # eksik paket eski onbellekten gelmis gibi gorunur.
      - name: APT paket onbellegi
        uses: actions/cache@v6
        with:
          path: ~/apt-arsiv
          key: apt-texlive-${{ runner.os }}-v1

      - name: TeX Live kur
        run: |
          # apt kurulumdan SONRA .deb'leri siliyor; onbellek icin tutmasi sart.
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/99onbellek > /dev/null
          mkdir -p ~/apt-arsiv
          # Onbellekteki paketleri apt'nin arsivine koy: apt indirmek yerine
          # bunlari kullanir. `-n`: var olanin ustune yazma.
          sudo cp -n ~/apt-arsiv/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-luatex texlive-xetex texlive-bibtex-extra texlive-binaries \
            biber python3-pygments
          lualatex --version | head -1
          kpsewhich minted.sty && command -v biber pygmentize
          # synctex ŞART: yoksa test_synctex_live pytestmark ile komple skip
          # olur ve bu job onu koşturuyormuş gibi sessizce yeşil geçer.
          command -v synctex || { echo "::error::synctex bulunamadı"; exit 1; }

      - name: Install system dependencies (PyQt6 headless)
        run: |
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libgl1 libegl1 libglib2.0-0 \
            libdbus-1-3 libxkbcommon0 libfontconfig1

      # Iki apt adimindan SONRA: bir sonraki kosunun indirmeden kurmasi icin
      # .deb'ler onbellege yazilacak dizine kopyalaniyor. actions/cache is
      # sonunda burayi kendiliginden sakliyor.
      - name: Paketleri onbellege al
        run: |
          mkdir -p ~/apt-arsiv
          sudo cp -n /var/cache/apt/archives/*.deb ~/apt-arsiv/ 2>/dev/null || true
          sudo chown -R "$USER" ~/apt-arsiv
          echo "onbellekteki paket: $(ls ~/apt-arsiv/*.deb 2>/dev/null | wc -l)"
          du -sh ~/apt-arsiv || true

      # Pillow yalniz testlerin kehaneti (test_pdf_baglanti_derleme to_pil).
      - name: Install Python dependencies
        run: pip install -r desktop/requirements.txt pytest Pillow

      - name: Gerçek TeX entegrasyon testleri (derle.sh + SyncTeX + tablo + ipucu + baglanti + kaynakca)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_derle_sh.py tests/test_synctex_live.py tests/test_tablo_derleme.py tests/test_ipucu_derleme.py tests/test_pdf_baglanti_derleme.py tests/test_kaynakca_derleme.py -v

  # ============================================================
  # GECICI ON UCUS ISLERI. BIRLESTIRILMEYECEK.
  #
  # Uc degisiklik: eylemler Node 24'lu surumlere yukseltildi (checkout v7,
  # setup-python v7, cache v6, upload-artifact v7, action-gh-release v3,
  # Pages eylemleri), pypdfium2 siniri <6 (paketler 4.30.0 yerine 5.x
  # kuracak), test isine pip-audit eklendi. Yayin isleri yalniz `v*`
  # tag'inde kosuyor; bu uc is onlarin yapim adimlarini YENI eylem
  # surumleriyle kopyaliyor. Sonuc gorulunce PR birlestirilmeden
  # kapatilacak ve dal silinecek.
  # ============================================================
  onucus-exe:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Get version
        id: ver
        shell: bash
        run: echo "VERSION=$(grep VERSION core/version.py | cut -d'"' -f2)" >> $GITHUB_OUTPUT

      # release.yml build-windows ile AYNI kurulum.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt -r desktop/requirements-build.txt

      - name: Yapim ortaminda Pillow var mi
        shell: bash
        run: |
          if python -c "import PIL" 2>/dev/null; then
            echo "::error::Pillow yapim ortamina gelmis (bir bagimlilik cekiyor)"; exit 1
          fi
          echo "Pillow yapim ortaminda yok"
          python -c "from importlib.metadata import version; print('yapim ortaminda pypdfium2', version('pypdfium2'))"

      - name: Build exe
        working-directory: desktop
        run: python -m PyInstaller "LaTeX Editor.spec" --clean --noconfirm

      - name: Paket denetimi (release.yml ile ayni)
        working-directory: desktop
        run: python ../scripts/paket_dogrula.py "dist/LaTeX Editor.exe"

      - name: Paketteki cizim kodu ve boyut
        working-directory: desktop
        shell: bash
        run: |
          python ../.github/scripts/_onucus_cizim.py "dist/LaTeX Editor.exe"
          yeni=$(stat -c %s "dist/LaTeX Editor.exe")
          eski=$(gh api "repos/${{ github.repository }}/releases/tags/v1.2.2" \
                 --jq '.assets[] | select(.name | endswith("_Windows.exe")) | .size')
          echo "exe: $yeni bayt | v1.2.2: $eski bayt | fark: $(( (eski - yeni) / 1024 )) KB"

      - name: Duman testi (25 sn, Turkce arayuz)
        working-directory: desktop
        shell: pwsh
        run: |
          reg add "HKCU\Software\LatexEditor\LatexEditor" /v language /t REG_SZ /d tr /f | Out-Null
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\LaTeX Editor.exe" -PassThru
          Start-Sleep -Seconds 25
          $ayakta = -not $p.HasExited
          taskkill /PID $p.Id /T /F | Out-Null
          Start-Sleep -Seconds 2
          $g = Get-ChildItem -Path $env:LOCALAPPDATA -Recurse -Filter latex-editor.log -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $g) { Write-Output "::error::gunluk bulunamadi"; exit 1 }
          $metin = Get-Content $g.FullName -Encoding UTF8
          $metin
          Write-Output "25 sn ayakta: $ayakta"
          if (-not $ayakta) { exit 1 }
          if (-not ($metin -match "Çeviri yüklendi: tr")) { Write-Output "::error::Turkce katalog yuklenmedi"; exit 1 }
          if ($metin -match "ERROR|WARNING") { Write-Output "::error::gunlukte ERROR/WARNING"; exit 1 }
          Write-Output "duman testi temiz"


  onucus-appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Get version
        id: ver
        shell: bash
        run: echo "VERSION=$(grep VERSION core/version.py | cut -d'"' -f2)" >> $GITHUB_OUTPUT

      # release.yml build-linux ile AYNI paket listesi (inkscape dahil:
      # build_appimage.sh'in Pillow'lu simge dali bu yuzden CI'da kosuyor).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv inkscape \
            libxcb-cursor0 libgl1 libegl1 libglib2.0-0 \
            libdbus-1-3 libxkbcommon0 libfontconfig1 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-xkb1 \
            libxcb-image0 libxcb-randr0 libxcb-render0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 \
            libxcb-xfixes0 libx11-xcb1

      - name: Build AppImage (simge adimi dahil)
        working-directory: desktop
        run: |
          set -o pipefail
          bash build_appimage.sh 2>&1 | tee build.log
          grep -q "SVG->PNG" build.log || { echo "::error::inkscape simge adimi kosmadi"; exit 1; }
          echo "simge adimi kostu: $(file linux/latex-editor.png)"

      - name: AppImage bagimliliklari cozuluyor mu (release.yml ile ayni)
        working-directory: desktop
        run: |
          eklenti=$(find dist/latex-editor/_internal -name libqxcb.so | head -1)
          test -n "$eklenti" || { echo "::error::libqxcb.so bulunamadi"; exit 1; }
          eksik=$(LD_LIBRARY_PATH="$PWD/dist/latex-editor/_internal" \
                  ldd "$eklenti" | grep "not found" || true)
          if [ -n "$eksik" ]; then
            echo "::error::AppImage kendi kendine yetmiyor:"; echo "$eksik"; exit 1
          fi
          echo "xcb eklentisinin butun bagimliliklari cozuluyor"

      - name: Paket denetimi (release.yml ile ayni)
        working-directory: desktop
        run: |
          ai=dist/LaTeX_Editor_v${{ steps.ver.outputs.VERSION }}_Linux_x86_64.AppImage
          chmod +x "$ai"
          "./$ai" --appimage-extract > /dev/null
          python3 ../scripts/paket_dogrula.py squashfs-root/usr/bin

      - name: Paketteki cizim kodu ve boyut
        working-directory: desktop
        run: |
          .venv-build/bin/python -c "from importlib.metadata import version; print('yapim ortaminda pypdfium2', version('pypdfium2'))"
          .venv-build/bin/python ../.github/scripts/_onucus_cizim.py squashfs-root/usr/bin/latex-editor
          ai=dist/LaTeX_Editor_v${{ steps.ver.outputs.VERSION }}_Linux_x86_64.AppImage
          yeni=$(stat -c %s "$ai")
          eski=$(gh api "repos/${{ github.repository }}/releases/tags/v1.2.2" \
                 --jq '.assets[] | select(.name | endswith("_Linux_x86_64.AppImage")) | .size')
          echo "AppImage: $yeni bayt | v1.2.2: $eski bayt | fark: $(( (eski - yeni) / 1024 )) KB"
          echo "acilmis usr/bin: $(du -sb squashfs-root/usr/bin | cut -f1) bayt"

      - name: Duman testi (20 sn, Turkce arayuz)
        working-directory: desktop
        run: |
          EV=$(mktemp -d)
          mkdir -p "$EV/.config/LatexEditor" "$EV/run"
          chmod 700 "$EV/run"
          printf '[General]\nlanguage=tr\n' > "$EV/.config/LatexEditor/LatexEditor.conf"
          set +e
          env -i HOME="$EV" USER=onucus LANG=C.UTF-8 PATH=/usr/bin:/bin \
            XDG_CONFIG_HOME="$EV/.config" XDG_DATA_HOME="$EV/.local/share" \
            XDG_CACHE_HOME="$EV/.cache" XDG_RUNTIME_DIR="$EV/run" \
            QT_QPA_PLATFORM=offscreen timeout 20 squashfs-root/AppRun > "$EV/stdout.txt" 2>&1
          kod=$?
          set -e
          echo "AppRun cikis: $kod (124 = 20 sn ayakta kaldi)"
          G="$EV/.local/share/LatexEditor/latex-editor.log"
          cat "$G"
          test "$kod" -eq 124
          grep -q "Çeviri yüklendi: tr" "$G"
          grep -q "Qt çevirisi yüklendi: qtbase_tr" "$G"
          if grep -E "ERROR|WARNING" "$G"; then exit 1; fi
          echo "duman testi temiz"


  onucus-dmg:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Get version
        shell: bash
        id: ver
        run: echo "VERSION=$(grep VERSION core/version.py | cut -d'"' -f2)" >> $GITHUB_OUTPUT

      # release.yml build-macos ile AYNI kurulum.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt pyinstaller

      - name: Yapim ortaminda Pillow var mi
        run: |
          if python -c "import PIL" 2>/dev/null; then
            echo "::error::Pillow yapim ortamina gelmis (bir bagimlilik cekiyor)"; exit 1
          fi
          echo "Pillow yapim ortaminda yok"
          python -c "from importlib.metadata import version; print('yapim ortaminda pypdfium2', version('pypdfium2'))"

      - name: Paket ikonunu uret (.icns)
        run: |
          bash desktop/macos_ikon_uret.sh
          test -f desktop/linux/latex-editor.icns

      - name: Build .app
        working-directory: desktop
        run: |
          python -m PyInstaller --noconfirm latex-editor-macos.spec
          test -d "dist/LaTeX Editor.app"
          du -sh "dist/LaTeX Editor.app" | sed 's/^/.app boyutu: /'

      - name: Paket denetimi (release.yml ile ayni)
        working-directory: desktop
        run: python3 ../scripts/paket_dogrula.py "dist/LaTeX Editor.app"

      - name: Imza gecerli mi (release.yml ile ayni)
        working-directory: desktop
        run: codesign --verify --deep --strict --verbose=2 "dist/LaTeX Editor.app"

      - name: Paketteki cizim kodu
        working-directory: desktop
        run: python ../.github/scripts/_onucus_cizim.py "dist/LaTeX Editor.app"

      - name: Build .dmg ve boyut
        working-directory: desktop
        run: |
          ad="LaTeX_Editor_v${{ steps.ver.outputs.VERSION }}_macOS_arm64"
          mkdir -p "$RUNNER_TEMP/dmg"
          cp -R "dist/LaTeX Editor.app" "$RUNNER_TEMP/dmg/"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname "LaTeX Editor" \
            -srcfolder "$RUNNER_TEMP/dmg" -ov -format UDZO \
            "dist/$ad.dmg" > /dev/null
          hdiutil verify "dist/$ad.dmg" > /dev/null
          yeni=$(stat -f %z "dist/$ad.dmg")
          eski=$(gh api "repos/${{ github.repository }}/releases/tags/v1.2.2" \
                 --jq '.assets[] | select(.name | endswith("_macOS_arm64.dmg")) | .size')
          echo "dmg: $yeni bayt | v1.2.2: $eski bayt | fark: $(( (eski - yeni) / 1024 )) KB"

      - name: Duman testi (20 sn)
        working-directory: desktop
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen "dist/LaTeX Editor.app/Contents/MacOS/latex-editor" \
            > "$RUNNER_TEMP/stdout.txt" 2>&1 &
          pid=$!
          sleep 20
          if kill -0 "$pid" 2>/dev/null; then ayakta=1; else ayakta=0; fi
          kill "$pid" 2>/dev/null; sleep 2; kill -9 "$pid" 2>/dev/null
          set -e
          G="$HOME/Library/Application Support/LatexEditor/latex-editor.log"
          cat "$G" || tail -20 "$RUNNER_TEMP/stdout.txt"
          echo "20 sn ayakta: $ayakta"
          test "$ayakta" -eq 1
          grep -q "Çeviri yüklendi:" "$G"
          if grep -E "ERROR|WARNING" "$G"; then exit 1; fi
          echo "duman testi temiz"
