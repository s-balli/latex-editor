name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # requires-python >=3.10: en eski desteklenen + güncel
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (PyQt6 headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libgl1 libegl1 libglib2.0-0 \
            libdbus-1-3 libxkbcommon0 libfontconfig1

      - name: Install pandoc (recent; exporter --embed-resources/--citeproc gerektirir)
        run: |
          set -e
          DEB_URL=$(curl -s https://api.github.com/repos/jgm/pandoc/releases/latest \
            | grep -oE 'https://[^"]+amd64\.deb' | head -1)
          curl -sL -o /tmp/pandoc.deb "$DEB_URL"
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pytest python-docx

      - name: Kayit: bagimlilik surumleri (ODR B3)
        run: pip freeze | grep -iE "pyqt6|qscintilla|pypdfium|pillow|send2trash|dulwich|pytest|docx"

      - name: Lint (ruff)
        run: |
          pip install "ruff==0.16.2"
          ruff check desktop/ core/ tests/

      - name: EN çeviriler tamamlanmış mı
        run: |
          if grep -q 'type="unfinished"' desktop/translations/latexeditor_en.ts; then
            echo "latexeditor_en.ts içinde unfinished çeviri var:"
            grep -c 'type="unfinished"' desktop/translations/latexeditor_en.ts
            echo "Düzeltme: PATH=/usr/lib/qt6/bin:\$PATH bash scripts/update_translations.sh + EN doldurma"
            exit 1
          fi

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q
