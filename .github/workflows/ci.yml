name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (PyQt6 headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libgl1 libegl1 libglib2.0-0 \
            libdbus-1-3 libxkbcommon0 libfontconfig1

      - name: Install pandoc (recent; exporter --embed-resources/--citeproc gerektirir)
        run: |
          set -e
          DEB_URL=$(curl -s https://api.github.com/repos/jgm/pandoc/releases/latest \
            | grep -oE 'https://[^"]+amd64\.deb' | head -1)
          curl -sL -o /tmp/pandoc.deb "$DEB_URL"
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pytest python-docx

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check desktop/ core/ tests/

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q
