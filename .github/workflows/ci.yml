name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # requires-python >=3.10: en eski desteklenen + güncel
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (PyQt6 headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libgl1 libegl1 libglib2.0-0 \
            libdbus-1-3 libxkbcommon0 libfontconfig1

      # Sürüm SABİT ve adres DOĞRUDAN: eskiden her koşuda
      # api.github.com/repos/jgm/pandoc/releases/latest çağrılıyordu. Kimliksiz
      # API isteği saatlik kotaya tabi ve runner IP'leri paylaşımlı; kota
      # dolduğunda üç deneme de boş dönüp CI testlere hiç gelmeden düşüyordu
      # (2026-08-30, run 33330237247). Tekrar döngüsü ağ takılmasını kurtarır,
      # kota aşımını kurtarmaz. Ayrıca "latest" ile pandoc her yükseldiğinde
      # test ortamı habersiz değişiyordu — sabit sürüm tekrarlanabilir.
      # Ubuntu deposundaki pandoc (22.04'te 2.9) YETMEZ: exporter
      # --embed-resources (pandoc 3.0+) ve --citeproc kullanıyor.
      # Yükseltmek için: PANDOC_VERSION'ı değiştir, başka yeri elleme.
      - name: Install pandoc (exporter --embed-resources/--citeproc gerektirir)
        env:
          PANDOC_VERSION: "3.11"
        run: |
          set -e
          URL="https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          curl -sfL --retry 5 --retry-all-errors --connect-timeout 15 -o /tmp/pandoc.deb "$URL"
          sudo dpkg -i /tmp/pandoc.deb
          # Kurulan sürüm sabitlenenle aynı mı — sessiz sapma olmasın
          KURULU="$(pandoc --version | head -1 | awk '{print $2}')"
          echo "pandoc $KURULU"
          if [ "$KURULU" != "$PANDOC_VERSION" ]; then
            echo "::error::pandoc $PANDOC_VERSION bekleniyordu, $KURULU kuruldu"
            exit 1
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pytest

      - name: Bagimlilik surumleri kaydi (ODR B3)
        run: pip freeze | grep -iE "pyqt6|qscintilla|pypdfium|pillow|send2trash|dulwich|pytest"

      - name: Lint (ruff)
        run: |
          pip install "ruff==0.16.2"
          ruff check desktop/ core/ tests/

      - name: EN çeviriler tamamlanmış mı
        run: |
          if grep -q 'type="unfinished"' desktop/translations/latexeditor_en.ts; then
            echo "latexeditor_en.ts içinde unfinished çeviri var:"
            grep -c 'type="unfinished"' desktop/translations/latexeditor_en.ts
            echo "Düzeltme: PATH=/usr/lib/qt6/bin:\$PATH bash scripts/update_translations.sh + EN doldurma"
            exit 1
          fi

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

  derle:
    # derle.sh zinciri GERÇEK TeX ile: matrix job'da TeX kurulmadığından
    # test_derle_sh.py orada hep skip oluyordu; derleme betiği yalnız
    # geliştirici makinesinde deneniyordu. Paket seti test belgelerinin
    # gerçek bağımlılıkları: article (latex-base), fontspec
    # (latex-recommended), biblatex+biber (bibtex-extra), minted+Pygments
    # (latex-extra + python3-pygments); üç motor da motor testlerinde gerekli.
    # PyQt6/pandoc gerekmez: dosya yalnız bash + pytest kullanır.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: TeX Live kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-luatex texlive-xetex texlive-bibtex-extra \
            biber python3-pygments
          lualatex --version | head -1
          kpsewhich minted.sty && command -v biber pygmentize

      - name: Install pytest
        run: pip install pytest

      - name: derle.sh entegrasyon testleri (gerçek TeX)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_derle_sh.py -v
