# GECICI: release.yml'ye eklenen apt onbelleginin gercekten calistigini
# olcmek icin. release.yml YALNIZ tag'de kostugu icin PR'da denenemiyor;
# bu dosya ayni iki bloku ayni anahtarlarla kosturuyor.
#
# runs-on release.yml ile AYNI olmali. Ilk denememde ubuntu-latest yazmistim
# ve o 24.04'e cozuluyor: baska bir dagitim olctum. 24.04'te libglib2.0-0
# t64 gecisiyle libglib2.0-0t64 olarak kuruluyor, o yuzden dogrulama adimi
# dustu. release.yml 22.04 pinliyor, deneme de 22.04 olmali.
#
# Beklenen: 1. kosu onbellek ISKA (indirir, arsive yazar), 2. kosu ISABET
# ("Need to get 0 B" ve adim belirgin sekilde kisalir).
#
# BIRLESTIRMEDEN ONCE SILINECEK.
name: apt onbellek denemesi

on:
  pull_request:
    branches: [main]

jobs:
  pyqt-blogu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: APT paket onbellegi
        uses: actions/cache@v4
        with:
          path: ~/apt-arsiv
          key: apt-pyqt-ubuntu-22.04-v1

      - name: Install system dependencies (PyQt6 headless)
        run: |
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/99onbellek > /dev/null
          mkdir -p ~/apt-arsiv
          sudo cp -n ~/apt-arsiv/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libgl1 libegl1 libglib2.0-0 \
            libdbus-1-3 libxkbcommon0 libfontconfig1

      - name: Paketleri onbellege al
        run: |
          mkdir -p ~/apt-arsiv
          sudo cp -n /var/cache/apt/archives/*.deb ~/apt-arsiv/ 2>/dev/null || true
          sudo chown -R "$USER" ~/apt-arsiv
          echo "onbellekteki paket: $(ls ~/apt-arsiv/*.deb 2>/dev/null | wc -l)"

      # Paketler GERCEKTEN kuruldu mu: onbellekten gelen .deb ise apt onu
      # kurmali, yalnizca indirmeyi atlamali. Kurulmadiysa release'de PyQt6
      # headless calismaz ve bunu ancak bir sonraki surumde gorurduk.
      #
      # dpkg -s ile ada bakmiyoruz: gecis paketleri (libglib2.0-0 -> ...t64)
      # baska adla kuruluyor ve isim denetimi yanlis yere dusuyor. Benzetimli
      # kurulum dogrudan sorulmasi gereken seyi soruyor: bu paketlerin hepsi
      # su an karsilanmis durumda mi.
      - name: Paketler kurulu mu
        run: |
          cikti=$(sudo apt-get install -s --no-install-recommends \
            libxcb-cursor0 libgl1 libegl1 libglib2.0-0 \
            libdbus-1-3 libxkbcommon0 libfontconfig1)
          echo "$cikti" | tail -2
          echo "$cikti" | grep -q "0 newly installed" \
            || { echo "::error::paketlerin hepsi kurulu degil"; exit 1; }
          echo "yedi paketin hepsi karsilanmis"

  appimage-blogu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: APT paket onbellegi
        uses: actions/cache@v4
        with:
          path: ~/apt-arsiv
          key: apt-appimage-ubuntu-22.04-v1

      - name: Install system dependencies
        run: |
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/99onbellek > /dev/null
          mkdir -p ~/apt-arsiv
          sudo cp -n ~/apt-arsiv/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv inkscape \
            libxcb-cursor0 libgl1 libegl1 libglib2.0-0 \
            libdbus-1-3 libxkbcommon0 libfontconfig1

      - name: Paketleri onbellege al
        run: |
          mkdir -p ~/apt-arsiv
          sudo cp -n /var/cache/apt/archives/*.deb ~/apt-arsiv/ 2>/dev/null || true
          sudo chown -R "$USER" ~/apt-arsiv
          echo "onbellekteki paket: $(ls ~/apt-arsiv/*.deb 2>/dev/null | wc -l)"

      - name: Paketler kurulu mu
        run: |
          cikti=$(sudo apt-get install -s --no-install-recommends \
            python3-venv inkscape \
            libxcb-cursor0 libgl1 libegl1 libglib2.0-0 \
            libdbus-1-3 libxkbcommon0 libfontconfig1)
          echo "$cikti" | tail -2
          echo "$cikti" | grep -q "0 newly installed" \
            || { echo "::error::paketlerin hepsi kurulu degil"; exit 1; }
          inkscape --version
          echo "dokuz paketin hepsi karsilanmis"
