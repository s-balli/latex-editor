name: Paketleme denemesi (GECICI)

# GECICI IS AKISI, birlestirmeden ONCE SILINECEK.
#
# NEDEN VAR: yazim denetimi sozlugu ve spylls artik pakete giriyor, ama
# `release.yml` YALNIZ TAG'DE kosuyor. Tag atip yayin yapmadan once paketin
# gercekten calistigini gormek gerekiyor; bir kez yanlis exe yayinlamak
# geri alinamiyor.
#
# release.yml'in yapim adimlarini AYNEN tekrarliyor, ustune paketin icini
# denetliyor: sozluk gercekten girmis mi, spylls gorunuyor mu, denetleyici
# paketlenmis halden yukleniyor mu.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt -r desktop/requirements-build.txt

      # release.yml ile AYNI komut
      - name: Build exe
        working-directory: desktop
        run: python -m PyInstaller "LaTeX Editor.spec" --clean --noconfirm

      - name: Paketin ICI denetlensin
        shell: bash
        working-directory: desktop
        run: |
          ls -la dist/
          echo "exe boyutu: $(( $(stat -c%s "dist/LaTeX Editor.exe") / 1048576 )) MB"
          test -f ../sozlukler/tr_TR.dic || { echo "SOZLUK ACILMAMIS"; exit 1; }
          echo "sozluk acildi: $(stat -c%s ../sozlukler/tr_TR.dic) bayt"
          python ../scripts/paket_dogrula.py "dist/LaTeX Editor.exe"

      # Sozlugun gercekten calistigi ARTIK KALICI TESTTE:
      # tests/test_yazim_sozluk.py. Burada heredoc'la tekrarlanmiyor;
      # Windows kosucusunda bash heredoc'una Turkce karakter gommek
      # kodlama riski (bkz. o dosyadaki gerekce).
      - name: Sozluk testleri
        run: |
          pip install pytest
          python -m pytest tests/test_yazim_sozluk.py -q

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv libxcb-cursor0 libgl1 libegl1 libglib2.0-0 \
            libdbus-1-3 libxkbcommon0 libfontconfig1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt -r desktop/requirements-build.txt

      # AppImage'in tamamini kurmak yerine yalniz PyInstaller adimi:
      # denenmek istenen sey spec, appimagetool degil.
      - name: Build (spec)
        working-directory: desktop
        run: python -m PyInstaller latex-editor-linux.spec --clean --noconfirm

      - name: Paketin ICI denetlensin
        working-directory: desktop
        run: |
          ls -la dist/
          test -f ../sozlukler/tr_TR.dic || { echo "SOZLUK ACILMAMIS"; exit 1; }
          cikti=$(ls dist/ | head -1)
          echo "boyut: $(du -sh "dist/$cikti" | cut -f1)"
          python ../scripts/paket_dogrula.py "dist/$cikti"

      - name: Sozluk testleri
        run: |
          pip install pytest
          python -m pytest tests/test_yazim_sozluk.py -q
